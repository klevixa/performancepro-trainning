<script>
const db=supabase.createClient("https://iuynmlcqthdzassbazag.supabase.co","sb_publishable_a6J4GrkdHU_YJrM-KR4x8Q_0UB_x4AX");let U,P,A,R=null;const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const M=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function login(){try{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error;U=r.data.user;await enter()}catch(e){$("msg").innerHTML='<div class="msg">'+E(e.message)+'</div>'}}

function nav(){let n=P.role==="admin"?[["dashboard","Dashboard"],["students","Alunos"],["prescribe","Prescrever"],["calendar","Calendário"],["feedbacks","Feedbacks"],["progress","Evolução"],["finance","Financeiro"]]:[["today","Meus treinos"],["calendar","Calendário"],["feedbacks","Feedback"],["progress","Minha evolução"]];$("nav").innerHTML=n.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")+'<button onclick="out()">Sair</button>'}
async function out(){await db.auth.signOut();location.reload()}async function go(p){let N={dashboard:"Dashboard",students:"Alunos",prescribe:"Prescrever treino",calendar:"Calendário",feedbacks:"Feedbacks",progress:"Evolução",finance:"Financeiro",today:"Meus treinos"};$("title").textContent=N[p];$("content").innerHTML='<div class="card">Carregando...</div>';try{await ({dashboard,students,prescribe,calendar,feedbacks,progress,finance,today}[p])()}catch(e){$("content").innerHTML='<div class="card">'+E(e.message)+'</div>'}}
async function dashboard(){let[a,t,f,p]=await Promise.all([db.from("alunos").select("id",{count:"exact"}).eq("ativo",true),db.from("treinos").select("id",{count:"exact"}),db.from("feedbacks").select("id",{count:"exact"}),db.from("pagamentos").select("valor,status")]);let rec=(p.data||[]).filter(x=>x.status==="pago").reduce((s,x)=>s+ +x.valor,0);$("content").innerHTML=`<div class="grid"><div class="card kpi">Alunos<b>${a.count||0}</b></div><div class="card kpi">Treinos<b>${t.count||0}</b></div><div class="card kpi">Feedbacks<b>${f.count||0}</b></div><div class="card kpi">Recebido<b>${M(rec)}</b></div></div>`}
async function students(){let r=await db.from("alunos").select("*").order("nome");if(r.error)throw r.error;$('content').innerHTML=`<div class="card"><h2>Novo aluno</h2><p class="muted">O cadastro cria a ficha, vincula a conta e envia o convite de acesso por e-mail.</p><div id="studentMsg"></div><div class="form"><div><label>Nome</label><input id="an"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Telefone</label><input id="at"></div><div><label>Observações</label><input id="ao"></div><div class="full"><button id="addBtn" class="btn" onclick="addA()">Cadastrar e enviar acesso</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.nome)}</td><td>${E(x.email||'—')}</td><td>${x.ativo?'Ativo':'Inativo'}</td><td><div class="actions"><button class="btn btn2" onclick="toggleA('${x.id}',${x.ativo})">${x.ativo?'Desativar':'Reativar'}</button><button class="btn danger" onclick="deleteA('${x.id}','${encodeURIComponent(x.nome||'Aluno')}')">Excluir</button></div></td></tr>`).join('')}</table></div>`}
async function addA(){let nome=$('an').value.trim(),email=$('ae').value.trim(),telefone=$('at').value.trim(),observacoes=$('ao').value.trim();if(!nome||!email)return alert('Informe nome e e-mail.');let b=$('addBtn');b.disabled=true;b.textContent='Cadastrando...';try{let {data,error}=await db.functions.invoke('criar-aluno',{body:{nome,email,telefone,observacoes}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao cadastrar aluno.');alert(data?.message||'Aluno cadastrado e convite enviado.');await students()}catch(e){alert('Não foi possível cadastrar: '+(e.message||e))}finally{if($('addBtn')){$('addBtn').disabled=false;$('addBtn').textContent='Cadastrar e enviar acesso'}}}
async function toggleA(id,ativo){let acao=ativo?'desativar':'reativar';if(!confirm(`Deseja ${acao} este aluno? O histórico será preservado.`))return;let r=await db.from('alunos').update({ativo:!ativo}).eq('id',id);if(r.error)return alert(r.error.message);alert(ativo?'Aluno desativado.':'Aluno reativado.');students()}
async function deleteA(id,nome){nome=decodeURIComponent(nome);let ok=prompt(`EXCLUSÃO DEFINITIVA\n\nIsso excluirá a conta de acesso e os dados vinculados do aluno ${nome}.\n\nPara confirmar, digite EXCLUIR:`);if(ok!=='EXCLUIR')return;try{let {data,error}=await db.functions.invoke('excluir-aluno',{body:{aluno_id:id}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao excluir aluno.');alert(data?.message||'Aluno excluído.');students()}catch(e){alert('Não foi possível excluir: '+(e.message||e))}}
async function lists(){let[a,m]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("modalidades").select("id,nome").eq("ativo",true)]);return[a.data||[],m.data||[]]}
async function prescribe(){let[a,m]=await lists();$('content').innerHTML=`<div class="card"><h2>Nova prescrição</h2><p class="muted">O mesmo aluno pode receber treinos de corrida e musculação. Escolha a modalidade para abrir os campos específicos.</p><div class="form"><div><label>Aluno</label><select id="ps">${a.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Modalidade</label><select id="pm" onchange="modeFields()">${m.map(x=>`<option value="${x.id}" data-name="${E(x.nome)}">${E(x.nome)}</option>`)}</select></div><div><label>Data</label><input id="pd" type="date"></div><div><label>Título do treino</label><input id="pt" placeholder="Ex.: Rodagem Z2 / Treino A - Inferiores"></div><div><label>Tipo</label><input id="pty" placeholder="Ex.: Contínuo, Intervalado, Força, Hipertrofia"></div><div><label>Duração planejada (min)</label><input id="pmin" type="number" min="0"></div><div><label>PSE prevista</label><input id="ppse" type="number" min="0" max="10"></div><div><label>Objetivo</label><input id="pobj" placeholder="Objetivo principal da sessão"></div><div id="runFields" class="full hide"><div class="card" style="background:#091523"><h3>🏃 Prescrição de corrida</h3><div class="form"><div><label>Distância planejada (km)</label><input id="rdist" type="number" min="0" step="0.01"></div><div><label>Zona de intensidade</label><input id="rzone" placeholder="Ex.: Z2, Z3, Z4"></div><div><label>Pace alvo mínimo (min/km)</label><input id="rpmin" type="time" step="1"></div><div><label>Pace alvo máximo (min/km)</label><input id="rpmax" type="time" step="1"></div><div class="full"><label>Estrutura do treino</label><textarea id="rstruct" placeholder="Ex.: 10 min aquecimento + 6 x 400 m / 2 min recuperação + 10 min desaquecimento"></textarea></div></div></div></div><div id="gymFields" class="full hide"><div class="card" style="background:#091523"><div class="exercise-head"><div><h3 style="margin:0">🏋️ Prescrição de musculação</h3><span class="mini">Adicione os exercícios na ordem em que o aluno deverá executar.</span></div><button type="button" class="btn" onclick="addExercise()">+ Exercício</button></div><div id="exerciseBox"></div></div></div><div class="full"><label>Observações gerais</label><textarea id="pobs" placeholder="Orientações gerais para a sessão"></textarea><br><button id="saveTBtn" class="btn" onclick="saveT()">Salvar treino</button></div></div></div>`;$('pd').value=new Date().toISOString().slice(0,10);modeFields()}
function currentMode(){let s=$('pm');return (s?.options[s.selectedIndex]?.dataset.name||'').toLowerCase()}
function modeFields(){let n=currentMode(),run=n.includes('corrida'),gym=n.includes('muscula')||n.includes('academia');$('runFields')?.classList.toggle('hide',!run);$('gymFields')?.classList.toggle('hide',!gym);if(gym&&$('exerciseBox')&&!$('exerciseBox').children.length)addExercise()}
let EXN=0;function addExercise(){EXN++;let d=document.createElement('div');d.className='exercise';d.dataset.ex='1';d.innerHTML=`<div class="exercise-head"><b>Exercício <span class="exnum">${document.querySelectorAll('[data-ex]').length+1}</span></b><button type="button" class="btn danger" onclick="this.closest('[data-ex]').remove();renumberExercises()">Remover</button></div><div class="form"><div><label>Exercício</label><input class="ex-name" placeholder="Ex.: Agachamento livre"></div><div><label>Grupo muscular</label><input class="ex-group" placeholder="Ex.: Quadríceps / Glúteos"></div><div><label>Séries</label><input class="ex-series" type="number" min="1" placeholder="3"></div><div><label>Repetições</label><input class="ex-reps" placeholder="Ex.: 10 ou 8-10"></div><div><label>Carga (kg)</label><input class="ex-kg" type="number" min="0" step="0.5"></div><div><label>RIR</label><input class="ex-rir" type="number" min="0" max="10" placeholder="Ex.: 2"></div><div><label>RPE</label><input class="ex-rpe" type="number" min="0" max="10" placeholder="Ex.: 8"></div><div><label>Descanso (seg)</label><input class="ex-rest" type="number" min="0" placeholder="Ex.: 90"></div><div class="full"><label>Orientações do exercício</label><input class="ex-obs" placeholder="Ex.: controlar a descida / amplitude confortável"></div></div>`;$('exerciseBox').appendChild(d);renumberExercises()}
function renumberExercises(){document.querySelectorAll('[data-ex]').forEach((x,i)=>{let n=x.querySelector('.exnum');if(n)n.textContent=i+1})}
function exerciseRows(){return [...document.querySelectorAll('[data-ex]')].map((x,i)=>({ordem:i+1,exercicio:x.querySelector('.ex-name').value.trim(),grupo_muscular:x.querySelector('.ex-group').value.trim()||null,series:+x.querySelector('.ex-series').value||null,repeticoes:x.querySelector('.ex-reps').value.trim()||null,carga_kg:x.querySelector('.ex-kg').value===''?null:+x.querySelector('.ex-kg').value,rir:x.querySelector('.ex-rir').value===''?null:+x.querySelector('.ex-rir').value,rpe:x.querySelector('.ex-rpe').value===''?null:+x.querySelector('.ex-rpe').value,descanso_seg:+x.querySelector('.ex-rest').value||null,observacoes:x.querySelector('.ex-obs').value.trim()||null})).filter(x=>x.exercicio)}
function paceSec(v){if(!v)return null;let p=v.split(':').map(Number);return p[0]*60+(p[1]||0)+(p[2]||0)/60}
async function saveT(){let mod=$('pm'),modName=currentMode(),isRun=modName.includes('corrida'),isGym=modName.includes('muscula')||modName.includes('academia');let p={aluno_id:$('ps').value,modalidade_id:mod.value,data_treino:$('pd').value,titulo:$('pt').value.trim(),tipo:$('pty').value.trim(),duracao_planejada_min:+$('pmin').value||null,pse_planejada:$('ppse').value===''?null:+$('ppse').value,objetivo:$('pobj').value.trim(),observacoes:$('pobs').value.trim(),criado_por:U.id};if(!p.aluno_id||!p.modalidade_id||!p.data_treino||!p.titulo)return alert('Preencha aluno, modalidade, data e título.');let ex=isGym?exerciseRows():[];if(isGym&&!ex.length)return alert('Adicione pelo menos um exercício ao treino de musculação.');let b=$('saveTBtn');b.disabled=true;b.textContent='Salvando...';let treinoId=null;try{let r=await db.from('treinos').insert(p).select('id').single();if(r.error)throw r.error;treinoId=r.data.id;if(isRun){let min=paceSec($('rpmin').value),max=paceSec($('rpmax').value);if(min&&max&&min>max)throw new Error('O pace mínimo deve ser mais rápido (menor) que o pace máximo.');let rc={treino_id:treinoId,distancia_km:+$('rdist').value||null,pace_min_seg:min?Math.round(min):null,pace_max_seg:max?Math.round(max):null,zona:$('rzone').value.trim()||null,estrutura:$('rstruct').value.trim()||null};let rr=await db.from('treino_corrida').insert(rc);if(rr.error)throw rr.error}if(isGym){let rows=ex.map(x=>({...x,treino_id:treinoId}));let gr=await db.from('exercicios_musculacao').insert(rows);if(gr.error)throw gr.error}alert('Treino salvo com sucesso.');go('calendar')}catch(e){if(treinoId)await db.from('treinos').delete().eq('id',treinoId);alert('Não foi possível salvar: '+(e.message||e));b.disabled=false;b.textContent='Salvar treino'}}
async function calendar(){let q=db.from("treinos").select("id,data_treino,titulo,tipo,status,alunos(nome),modalidades(nome)").order("data_treino",{ascending:false});if(P.role==="aluno"&&A)q=q.eq("aluno_id",A.id);let r=await q;if(r.error)throw r.error;$("content").innerHTML=`<div class="card"><table><tr><th>Data</th>${P.role==="admin"?"<th>Aluno</th>":""}<th>Modalidade</th><th>Treino</th><th>Status</th></tr>${(r.data||[]).map(x=>`<tr><td>${x.data_treino}</td>${P.role==="admin"?`<td>${E(x.alunos?.nome)}</td>`:""}<td>${E(x.modalidades?.nome)}</td><td>${E(x.titulo)}</td><td>${E(x.status)}</td></tr>`).join("")}</table></div>`}
async function today(){if(!A){$("content").innerHTML='<div class="card">Seu login ainda não foi vinculado à ficha de aluno.</div>';return}let r=await db.from("treinos").select("id,data_treino,titulo,tipo,objetivo,observacoes,duracao_planejada_min,pse_planejada,status,modalidades(nome),treino_corrida(distancia_km,pace_min_seg,pace_max_seg,zona,estrutura),exercicios_musculacao(ordem,exercicio,grupo_muscular,series,repeticoes,carga_kg,rir,rpe,descanso_seg,observacoes)").eq("aluno_id",A.id).order("data_treino",{ascending:false});if(r.error)throw r.error;let rows=r.data||[];if(!rows.length){$("content").innerHTML='<div class="card empty">Nenhum treino prescrito ainda.</div>';return}$("content").innerHTML=`<div class="grid">${rows.map(x=>{let ex=(x.exercicios_musculacao||[]).sort((a,b)=>(a.ordem||0)-(b.ordem||0));return `<div class="card workout-card"><div class="workout-meta"><span class="pill">${E(x.modalidades?.nome)}</span><span class="stat">📅 ${brDate(x.data_treino)}</span>${x.duracao_planejada_min?`<span class="stat">⏱ ${x.duracao_planejada_min} min</span>`:''}${x.pse_planejada!==null&&x.pse_planejada!==undefined?`<span class="stat">PSE ${x.pse_planejada}</span>`:''}</div><h2 class="workout-title">${E(x.titulo)}</h2>${x.tipo?`<div class="muted">${E(x.tipo)}</div>`:''}${x.objetivo?`<p><b>Objetivo:</b> ${E(x.objetivo)}</p>`:''}${x.treino_corrida?`<div class="exercise-list"><b>🏃 Corrida</b><div class="workout-meta">${x.treino_corrida.distancia_km?`<span class="stat">${x.treino_corrida.distancia_km} km</span>`:''}<span class="stat">Pace ${fmtPace(x.treino_corrida.pace_min_seg)}${x.treino_corrida.pace_max_seg?'–'+fmtPace(x.treino_corrida.pace_max_seg):''}/km</span>${x.treino_corrida.zona?`<span class="stat">${E(x.treino_corrida.zona)}</span>`:''}</div>${x.treino_corrida.estrutura?`<p><b>Estrutura:</b><br>${nl2br(x.treino_corrida.estrutura)}</p>`:''}</div>`:''}${ex.length?`<div class="exercise-list"><b>🏋️ Exercícios</b>${ex.map((z,i)=>`<div class="exercise-item"><div class="exercise-name">${i+1}. ${E(z.exercicio)}</div>${z.grupo_muscular?`<div class="mini">${E(z.grupo_muscular)}</div>`:''}<div class="workout-meta">${z.series?`<span class="stat">${z.series} séries</span>`:''}${z.repeticoes?`<span class="stat">${E(z.repeticoes)} reps</span>`:''}${z.carga_kg!==null&&z.carga_kg!==undefined?`<span class="stat">${z.carga_kg} kg</span>`:''}${z.rir!==null&&z.rir!==undefined?`<span class="stat">RIR ${z.rir}</span>`:''}${z.rpe!==null&&z.rpe!==undefined?`<span class="stat">RPE ${z.rpe}</span>`:''}${z.descanso_seg?`<span class="stat">Descanso ${z.descanso_seg}s</span>`:''}</div>${z.observacoes?`<div class="mini">${E(z.observacoes)}</div>`:''}</div>`).join('')}</div>`:''}${x.observacoes?`<p><b>Observações:</b><br>${nl2br(x.observacoes)}</p>`:''}<button class="btn" onclick="fb('${x.id}')">Enviar feedback</button></div>`}).join('')}</div>`}
function brDate(v){if(!v)return '';let [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
