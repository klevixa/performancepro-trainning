<div id="login" class="login"><div class="box"><div class="brand">PerformancePro <span>Trainning</span></div><h1>Entrar</h1><div id="msg"></div><label>E-mail</label><input id="email"><label>Senha</label><input id="pass" type="password"><br><br><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div>
<div id="app" class="app hide"><aside class="side"><div class="brand">PerformancePro <span>Trainning</span></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title"></h1><span id="hello" class="muted"></span></div><span id="role" class="badge"></span></div><div id="content"></div></main></div>
<script>
const db=supabase.createClient("https://iuynmlcqthdzassbazag.supabase.co","sb_publishable_a6J4GrkdHU_YJrM-KR4x8Q_0UB_x4AX");let U,P,A,R=null;const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const M=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function login(){try{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error;U=r.data.user;await enter()}catch(e){$("msg").innerHTML='<div class="msg">'+E(e.message)+'</div>'}}
async function enter(){let r=await db.from("profiles").select("*").eq("id",U.id).single();if(r.error)throw r.error;P=r.data;if(P.role==="aluno"){let x=await db.from("alunos").select("*").eq("user_id",U.id).maybeSingle();A=x.data}$("login").classList.add("hide");$("app").classList.remove("hide");$("hello").textContent="Olá, "+(P.nome||U.email);$("role").textContent=P.role==="admin"?"Admin":"Aluno";nav();go(P.role==="admin"?"dashboard":"today")}
function nav(){let n=P.role==="admin"?[["dashboard","Dashboard"],["students","Alunos"],["prescribe","Prescrever"],["calendar","Calendário"],["feedbacks","Feedbacks"],["progress","Evolução"],["finance","Financeiro"]]:[["today","Meus treinos"],["calendar","Calendário"],["feedbacks","Feedback"],["progress","Minha evolução"],["password","Alterar senha"]];$("nav").innerHTML=n.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")+'<button onclick="out()">Sair</button>'}
async function out(){await db.auth.signOut();location.reload()}async function go(p){let N={dashboard:"Dashboard",students:"Alunos",prescribe:"Prescrever treino",calendar:"Calendário",feedbacks:"Feedbacks",progress:"Evolução",finance:"Financeiro",today:"Meus treinos",password:"Alterar senha"};$("title").textContent=N[p];$("content").innerHTML='<div class="card">Carregando...</div>';try{await ({dashboard,students,prescribe,calendar,feedbacks,progress,finance,today,password}[p])()}catch(e){$("content").innerHTML='<div class="card">'+E(e.message)+'</div>'}}
async function dashboard(){
  const todayISO=new Date().toISOString().slice(0,10);
  const [a,t,pay,wr]=await Promise.all([
    db.from("alunos").select("id",{count:"exact"}).eq("ativo",true),
    db.from("treinos").select("id,aluno_id,data_treino,status,alunos(nome),feedbacks(realizado,pse,dor,dor_local,disposicao)"),
    db.from("pagamentos").select("valor,status"),
    db.from("feedbacks").select("id",{count:"exact"})
  ]);
  if(t.error)throw t.error;
  const rows=t.data||[],due=rows.filter(x=>x.data_treino<=todayISO);
  let done=0,missed=0,noanswer=0,alerts=[];
  due.forEach(x=>{const fs=feedbackArray(x.feedbacks),f=fs[0];if(x.status==='realizado'||fs.some(z=>z.realizado===true))done++;else if(x.status==='nao_realizado'||fs.some(z=>z.realizado===false))missed++;else noanswer++;if(f&&(f.dor===true||+(f.pse||0)>=8||(+f.disposicao>0&&+f.disposicao<=2)))alerts.push({x,f})});
  const rec=(pay.data||[]).filter(x=>x.status==='pago').reduce((z,x)=>z+ +(x.valor||0),0);
  const adh=due.length?Math.round(done/due.length*100):0;
  const recent=[...due].sort((x,y)=>y.data_treino.localeCompare(x.data_treino)).slice(0,10);
  $('content').innerHTML=`<div class="status-grid"><div class="card status-card"><span class="muted">Alunos ativos</span><div class="big">${a.count||0}</div></div><div class="card status-card good"><span class="muted">Realizados</span><div class="big">${done}</div><span class="mini">Aderência ${adh}%</span></div><div class="card status-card bad"><span class="muted">Não realizados</span><div class="big">${missed}</div></div><div class="card status-card pending"><span class="muted">Sem resposta</span><div class="big">${noanswer}</div></div></div><div class="grid section"><div class="card kpi">Alertas recentes<b>${alerts.length}</b><span class="mini">Dor, PSE ≥ 8 ou disposição baixa</span></div><div class="card kpi">Feedbacks<b>${wr.count||0}</b></div><div class="card kpi">Treinos prescritos<b>${rows.length}</b></div><div class="card kpi">Recebido<b>${M(rec)}</b></div></div>${alerts.length?`<div class="card section"><div class="section-title"><div><h2 style="margin:0">⚠️ Atenção da treinadora</h2><span class="muted">Feedbacks que merecem revisão</span></div><button class="btn btn2" onclick="go('feedbacks')">Ver feedbacks</button></div><div class="monitor-list section">${alerts.slice(0,8).map(({x,f})=>`<div class="monitor-row"><b>${E(x.alunos?.nome||'Aluno')}</b><span>${brDate(x.data_treino)}</span><span>PSE ${f.pse??'—'}</span><span>${f.dor?`Dor: ${E(f.dor_local||'informada')}`:(+f.disposicao<=2?'Disposição baixa':'PSE alta')}</span><button class="btn btn2" onclick="go('feedbacks')">Revisar</button></div>`).join('')}</div></div>`:''}<div class="card section"><div class="section-title"><div><h2 style="margin:0">Controle das sessões</h2><span class="muted">Sessões vencidas e de hoje</span></div></div><div class="monitor-list section">${recent.length?recent.map(x=>{let fs=feedbackArray(x.feedbacks),st=x.status==='realizado'||fs.some(f=>f.realizado===true)?['Realizado','tag-ok']:x.status==='nao_realizado'||fs.some(f=>f.realizado===false)?['Não realizado','tag-bad']:['Sem resposta','tag-warn'];return `<div class="monitor-row"><b>${E(x.alunos?.nome||'Aluno')}</b><span>${brDate(x.data_treino)}</span><span class="status-tag ${st[1]}">${st[0]}</span><span>${E(x.status||'planejado')}</span><button class="btn btn2" onclick="go('calendar')">Abrir calendário</button></div>`}).join(''):'<div class="empty">Nenhuma sessão vencida.</div>'}</div></div>`
}
async function students(){let r=await db.from("alunos").select("*").order("nome");if(r.error)throw r.error;$('content').innerHTML=`<div class="card"><h2>Novo aluno</h2><p class="muted">O cadastro cria a ficha e a conta de acesso imediatamente. A senha provisória será exibida uma única vez.</p><div id="studentMsg"></div><div class="form"><div><label>Nome</label><input id="an"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Telefone</label><input id="at"></div><div><label>Observações</label><input id="ao"></div><div class="full"><button id="addBtn" class="btn" onclick="addA()">Cadastrar aluno</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.nome)}</td><td>${E(x.email||'—')}</td><td>${x.ativo?'Ativo':'Inativo'}</td><td><div class="actions"><button class="btn btn2" onclick="toggleA('${x.id}',${x.ativo})">${x.ativo?'Desativar':'Reativar'}</button><button class="btn danger" onclick="deleteA('${x.id}','${encodeURIComponent(x.nome||'Aluno')}')">Excluir</button></div></td></tr>`).join('')}</table></div>`}
async function addA(){let nome=$('an').value.trim(),email=$('ae').value.trim(),telefone=$('at').value.trim(),observacoes=$('ao').value.trim();if(!nome||!email)return alert('Informe nome e e-mail.');let b=$('addBtn');b.disabled=true;b.textContent='Cadastrando...';try{let {data,error}=await db.functions.invoke('criar-aluno',{body:{nome,email,telefone,observacoes}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao cadastrar aluno.');if(data?.acesso?.senha_temporaria){const acesso=data.acesso;await students();const m=$('studentMsg');if(m)m.innerHTML=`<div class="access-box"><b>Aluno cadastrado com sucesso</b><p>Login: <strong>${E(acesso.email)}</strong><br>Senha provisória: <strong>${E(acesso.senha_temporaria)}</strong></p><button class="btn btn2" onclick="navigator.clipboard.writeText('${E(acesso.email)} | ${E(acesso.senha_temporaria)}');this.textContent='Copiado!'">Copiar acesso</button><p class="mini">Guarde agora: a senha provisória não será exibida novamente.</p></div>`;return}else{alert(data?.message||'Aluno cadastrado com sucesso.')}await students()}catch(e){alert('Não foi possível cadastrar: '+(e.message||e))}finally{if($('addBtn')){$('addBtn').disabled=false;$('addBtn').textContent='Cadastrar aluno'}}}
async function toggleA(id,ativo){let acao=ativo?'desativar':'reativar';if(!confirm(`Deseja ${acao} este aluno? O histórico será preservado.`))return;let r=await db.from('alunos').update({ativo:!ativo}).eq('id',id);if(r.error)return alert(r.error.message);alert(ativo?'Aluno desativado.':'Aluno reativado.');students()}
async function deleteA(id,nome){nome=decodeURIComponent(nome);let ok=prompt(`EXCLUSÃO DEFINITIVA\n\nIsso excluirá a conta de acesso e os dados vinculados do aluno ${nome}.\n\nPara confirmar, digite EXCLUIR:`);if(ok!=='EXCLUIR')return;try{let {data,error}=await db.functions.invoke('excluir-aluno',{body:{aluno_id:id}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao excluir aluno.');alert(data?.message||'Aluno excluído.');students()}catch(e){alert('Não foi possível excluir: '+(e.message||e))}}
async function lists(){let[a,m]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("modalidades").select("id,nome").eq("ativo",true)]);return[a.data||[],m.data||[]]}
let EDIT_T=null;
async function prescribe(editId=null,presetDate=null){EDIT_T=editId;let[a,m]=await lists();$('content').innerHTML=`<div class="card"><h2>${editId?'Editar treino':'Nova prescrição'}</h2><p class="muted">Corrida e musculação podem ser prescritas para o mesmo aluno. Para montar a semana, salve o treino e use “Duplicar” no calendário para criar as outras sessões rapidamente.</p><div class="form"><div><label>Aluno</label><select id="ps">${a.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Modalidade</label><select id="pm" onchange="modeFields()">${m.map(x=>`<option value="${x.id}" data-name="${E(x.nome)}">${E(x.nome)}</option>`)}</select></div><div><label>Data</label><input id="pd" type="date"></div><div><label>Título</label><input id="pt" placeholder="Ex.: Rodagem Z2 / Treino A - Inferiores"></div><div><label>Tipo</label><input id="pty" placeholder="Contínuo, Intervalado, Força, Hipertrofia..."></div><div><label>Duração planejada (min)</label><input id="pmin" type="number" min="0"></div><div><label>PSE prevista (0–10)</label><input id="ppse" type="number" min="0" max="10"></div><div><label>Objetivo</label><input id="pobj"></div><div id="runFields" class="full hide"><div class="card" style="background:#091523"><h3>🏃 Corrida</h3><div class="form"><div><label>Distância (km)</label><input id="rdist" type="number" step=".01"></div><div><label>Zona</label><input id="rzone" placeholder="Z1, Z2, Z3..."></div><div><label>Pace mais rápido (min/km)</label><input id="rpmin" type="time" step="1"></div><div><label>Pace mais lento (min/km)</label><input id="rpmax" type="time" step="1"></div><div class="full"><label>Estrutura</label><textarea id="rstruct" placeholder="10 min aquecimento + 6 x 400 m... "></textarea></div></div></div></div><div id="gymFields" class="full hide"><div class="card" style="background:#091523"><div class="exercise-head"><div><h3 style="margin:0">🏋️ Musculação</h3><span class="mini">Exercícios na ordem de execução.</span></div><button type="button" class="btn" onclick="addExercise()">+ Exercício</button></div><div id="exerciseBox"></div></div></div><div class="full"><label>Observações gerais</label><textarea id="pobs"></textarea><br><button id="saveTBtn" class="btn" onclick="saveT()">${editId?'Salvar alterações':'Salvar treino'}</button></div></div></div>`;$('pd').value=new Date().toISOString().slice(0,10);modeFields();if(presetDate&&$('td'))$('td').value=presetDate;if(editId)await loadEdit(editId)}
function currentMode(){let s=$('pm');return (s?.options[s.selectedIndex]?.dataset.name||'').toLowerCase()}
function modeFields(){let n=currentMode(),run=n.includes('corrida'),gym=n.includes('muscula')||n.includes('academia');$('runFields')?.classList.toggle('hide',!run);$('gymFields')?.classList.toggle('hide',!gym);if(gym&&$('exerciseBox')&&!$('exerciseBox').children.length)addExercise()}
let EXN=0;function addExercise(z={}){EXN++;let d=document.createElement('div');d.className='exercise';d.dataset.ex='1';d.innerHTML=`<div class="exercise-head"><b>Exercício <span class="exnum">${document.querySelectorAll('[data-ex]').length+1}</span></b><button type="button" class="btn danger" onclick="this.closest('[data-ex]').remove();renumberExercises()">Remover</button></div><div class="form"><div><label>Exercício</label><input class="ex-name" value="${E(z.exercicio||'')}"></div><div><label>Grupo muscular</label><input class="ex-group" value="${E(z.grupo_muscular||'')}"></div><div><label>Séries</label><input class="ex-series" type="number" value="${z.series??''}"></div><div><label>Repetições</label><input class="ex-reps" value="${E(z.repeticoes||'')}"></div><div><label>Carga (kg)</label><input class="ex-kg" type="number" step=".5" value="${z.carga_kg??''}"></div><div><label>RIR</label><input class="ex-rir" type="number" min="0" max="10" value="${z.rir??''}"></div><div><label>RPE</label><input class="ex-rpe" type="number" min="0" max="10" value="${z.rpe??''}"></div><div><label>Descanso (seg)</label><input class="ex-rest" type="number" value="${z.descanso_seg??''}"></div><div class="full"><label>Orientações</label><input class="ex-obs" value="${E(z.observacoes||'')}"></div></div>`;$('exerciseBox').appendChild(d);renumberExercises()}
function renumberExercises(){document.querySelectorAll('[data-ex]').forEach((x,i)=>x.querySelector('.exnum').textContent=i+1)}
function exerciseRows(){return [...document.querySelectorAll('[data-ex]')].map((x,i)=>({ordem:i+1,exercicio:x.querySelector('.ex-name').value.trim(),grupo_muscular:x.querySelector('.ex-group').value.trim()||null,series:+x.querySelector('.ex-series').value||null,repeticoes:x.querySelector('.ex-reps').value.trim()||null,carga_kg:x.querySelector('.ex-kg').value===''?null:+x.querySelector('.ex-kg').value,rir:x.querySelector('.ex-rir').value===''?null:+x.querySelector('.ex-rir').value,rpe:x.querySelector('.ex-rpe').value===''?null:+x.querySelector('.ex-rpe').value,descanso_seg:+x.querySelector('.ex-rest').value||null,observacoes:x.querySelector('.ex-obs').value.trim()||null})).filter(x=>x.exercicio)}
function paceSec(v){if(!v)return null;let p=v.split(':').map(Number);return p[0]*60+(p[1]||0)+(p[2]||0)/60}function paceInput(sec){if(!sec)return '';sec=Math.round(sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
async function loadEdit(id){let r=await db.from('treinos').select('*,treino_corrida(*),exercicios_musculacao(*)').eq('id',id).single();if(r.error)throw r.error;let x=r.data;$('ps').value=x.aluno_id;$('pm').value=x.modalidade_id;$('pd').value=x.data_treino;$('pt').value=x.titulo||'';$('pty').value=x.tipo||'';$('pmin').value=x.duracao_planejada_min??'';$('ppse').value=x.pse_planejada??'';$('pobj').value=x.objetivo||'';$('pobs').value=x.observacoes||'';modeFields();let c=Array.isArray(x.treino_corrida)?x.treino_corrida[0]:x.treino_corrida;if(c){$('rdist').value=c.distancia_planejada_km??'';$('rzone').value=c.zona||'';$('rpmin').value=paceInput(c.pace_min_seg);$('rpmax').value=paceInput(c.pace_max_seg);$('rstruct').value=c.estrutura||''}if((x.exercicios_musculacao||[]).length){$('exerciseBox').innerHTML='';x.exercicios_musculacao.sort((a,b)=>(a.ordem||0)-(b.ordem||0)).forEach(addExercise)}}
async function saveT(){let mod=$('pm'),modName=currentMode(),isRun=modName.includes('corrida'),isGym=modName.includes('muscula')||modName.includes('academia');let p={aluno_id:$('ps').value,modalidade_id:mod.value,data_treino:$('pd').value,titulo:$('pt').value.trim(),tipo:$('pty').value.trim(),duracao_planejada_min:+$('pmin').value||null,pse_planejada:$('ppse').value===''?null:+$('ppse').value,objetivo:$('pobj').value.trim(),observacoes:$('pobs').value.trim(),criado_por:U.id};if(!p.aluno_id||!p.modalidade_id||!p.data_treino||!p.titulo)return alert('Preencha aluno, modalidade, data e título.');let ex=isGym?exerciseRows():[];if(isGym&&!ex.length)return alert('Adicione pelo menos um exercício.');let b=$('saveTBtn');b.disabled=true;b.textContent='Salvando...';let treinoId=EDIT_T;try{if(EDIT_T){let r=await db.from('treinos').update(p).eq('id',EDIT_T);if(r.error)throw r.error;await db.from('treino_corrida').delete().eq('treino_id',EDIT_T);await db.from('exercicios_musculacao').delete().eq('treino_id',EDIT_T)}else{let r=await db.from('treinos').insert(p).select('id').single();if(r.error)throw r.error;treinoId=r.data.id}if(isRun){let min=paceSec($('rpmin').value),max=paceSec($('rpmax').value);if(min&&max&&min>max)throw new Error('O pace mais rápido deve ser menor que o pace mais lento.');let rr=await db.from('treino_corrida').insert({treino_id:treinoId,distancia_planejada_km:+$('rdist').value||null,pace_min_seg:min?Math.round(min):null,pace_max_seg:max?Math.round(max):null,zona:$('rzone').value.trim()||null,estrutura:$('rstruct').value.trim()||null});if(rr.error)throw rr.error}if(isGym){let gr=await db.from('exercicios_musculacao').insert(ex.map(x=>({...x,treino_id:treinoId})));if(gr.error)throw gr.error}alert(EDIT_T?'Treino atualizado.':'Treino salvo.');EDIT_T=null;go('calendar')}catch(e){if(!EDIT_T&&treinoId)await db.from('treinos').delete().eq('id',treinoId);alert('Não foi possível salvar: '+(e.message||e));b.disabled=false;b.textContent=EDIT_T?'Salvar alterações':'Salvar treino'}}
async function duplicateT(id){let data=prompt('Data do treino duplicado (AAAA-MM-DD):',new Date().toISOString().slice(0,10));if(!data)return;let r=await db.from('treinos').select('*,treino_corrida(*),exercicios_musculacao(*)').eq('id',id).single();if(r.error)return alert(r.error.message);let x=r.data,base={aluno_id:x.aluno_id,modalidade_id:x.modalidade_id,data_treino:data,titulo:x.titulo,tipo:x.tipo,duracao_planejada_min:x.duracao_planejada_min,pse_planejada:x.pse_planejada,objetivo:x.objetivo,observacoes:x.observacoes,criado_por:U.id};let n=await db.from('treinos').insert(base).select('id').single();if(n.error)return alert(n.error.message);let nid=n.data.id,c=Array.isArray(x.treino_corrida)?x.treino_corrida[0]:x.treino_corrida;if(c){let {id:_,treino_id:__,...rest}=c;let z=await db.from('treino_corrida').insert({...rest,treino_id:nid});if(z.error)return alert(z.error.message)}if((x.exercicios_musculacao||[]).length){let rows=x.exercicios_musculacao.map(z=>{let{id:_,treino_id:__,...rest}=z;return{...rest,treino_id:nid}});let q=await db.from('exercicios_musculacao').insert(rows);if(q.error)return alert(q.error.message)}alert('Treino duplicado.');calendar()}
async function deleteT(id){if(!confirm('Excluir este treino permanentemente? A prescrição, exercícios e registros vinculados a esta sessão serão removidos.'))return;try{let sr=await db.from('series_realizadas').delete().eq('treino_id',id);if(sr.error&&!String(sr.error.message||'').toLowerCase().includes('column'))throw sr.error;let b=await db.from('blocos_corrida').delete().eq('treino_id',id);if(b.error&&!String(b.error.message||'').toLowerCase().includes('column'))throw b.error;let f=await db.from('feedbacks').delete().eq('treino_id',id);if(f.error)throw f.error;let c=await db.from('treino_corrida').delete().eq('treino_id',id);if(c.error)throw c.error;let e=await db.from('exercicios_musculacao').delete().eq('treino_id',id);if(e.error)throw e.error;let r=await db.from('treinos').delete().eq('id',id);if(r.error)throw r.error;alert('Treino excluído.');calendar()}catch(err){alert('Não foi possível excluir: '+err.message)}}
async function calendar(offset=0){
  const base=new Date();base.setHours(12,0,0,0);const day=(base.getDay()+6)%7;base.setDate(base.getDate()-day+(offset*7));
  const iso=d=>d.toISOString().slice(0,10), start=iso(base), endD=new Date(base);endD.setDate(base.getDate()+6);const end=iso(endD);
  let q=db.from('treinos').select('*,alunos(nome),modalidades(nome),feedbacks(realizado,pse,duracao_real_min)').gte('data_treino',start).lte('data_treino',end).order('data_treino');
  if(P.role==='aluno'){if(!A)return; q=q.eq('aluno_id',A.id)}
  const r=await q;if(r.error)throw r.error;const rows=r.data||[];
  let days=[];for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);days.push(d)}
  const names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const cards=days.map((d,i)=>{const di=iso(d),items=rows.filter(x=>x.data_treino===di),isToday=di===new Date().toISOString().slice(0,10);return `<div class="week-day ${isToday?'today-day':''}"><div class="week-date"><strong>${names[i]}</strong><span>${brDate(di)}</span></div>${items.map(x=>`<div class="week-item"><div onclick="${P.role==='admin'?`prescribe('${x.id}')`:`go('today')`}" style="cursor:pointer"><b>${E(x.titulo)}</b><small>${E(x.modalidades?.nome||'')} ${P.role==='admin'?'• '+E(x.alunos?.nome||''):''}</small>${feedbackArray(x.feedbacks).some(f=>f.realizado===true)?'<div class="mini">✓ Realizado</div>':''}</div>${P.role==='admin'?`<div class="actions" style="margin-top:8px;gap:6px"><button class="btn btn2" style="padding:7px 9px" onclick="event.stopPropagation();prescribe('${x.id}')">Editar</button><button class="btn btn2" style="padding:7px 9px" onclick="event.stopPropagation();duplicateT('${x.id}')">Duplicar</button><button class="btn danger" style="padding:7px 9px" onclick="event.stopPropagation();deleteT('${x.id}')">Excluir</button></div>`:''}</div>`).join('')||'<div class="mini">Sem treino</div>'}${P.role==='admin'?`<button class="add-day" onclick="prescribe(null,'${di}')">+ Prescrever</button>`:''}</div>`}).join('');
  $('content').innerHTML=`<div class="card"><div class="week-head"><div><b>Planejador semanal</b><div class="muted">${brDate(start)} a ${brDate(end)}</div></div><div class="actions"><button class="btn btn2" onclick="calendar(${offset-1})">← Semana</button><button class="btn btn2" onclick="calendar(0)">Hoje</button><button class="btn btn2" onclick="calendar(${offset+1})">Semana →</button>${P.role==='admin'?`<button class="btn" onclick="copyPreviousWeek('${start}')">Copiar semana anterior</button>`:''}</div></div><div class="week-grid">${cards}</div></div>`;
}
async function copyPreviousWeek(targetStart){
  if(!confirm('Copiar todos os treinos da semana anterior para esta semana? Os treinos serão duplicados 7 dias à frente.'))return;
  const ts=new Date(targetStart+'T12:00:00'),ps=new Date(ts);ps.setDate(ts.getDate()-7),pe=new Date(ts);pe.setDate(ts.getDate()-1);const iso=d=>d.toISOString().slice(0,10);
  const r=await db.from('treinos').select('*,treino_corrida(*),exercicios_musculacao(*)').gte('data_treino',iso(ps)).lte('data_treino',iso(pe));if(r.error)return alert(r.error.message);if(!(r.data||[]).length)return alert('A semana anterior não possui treinos para copiar.');
  let ok=0;for(const x of r.data){const nd=new Date(x.data_treino+'T12:00:00');nd.setDate(nd.getDate()+7);const payload={aluno_id:x.aluno_id,modalidade_id:x.modalidade_id,data_treino:iso(nd),titulo:x.titulo,tipo:x.tipo,objetivo:x.objetivo,observacoes:x.observacoes,duracao_planejada_min:x.duracao_planejada_min,pse_planejada:x.pse_planejada,status:'planejado',criado_por:U.id};const ins=await db.from('treinos').insert(payload).select().single();if(ins.error)continue;const nid=ins.data.id;if(x.treino_corrida){let c=x.treino_corrida;await db.from('treino_corrida').insert({treino_id:nid,distancia_planejada_km:c.distancia_planejada_km,pace_min_seg:c.pace_min_seg,pace_max_seg:c.pace_max_seg,zona:c.zona,estrutura:c.estrutura})}if(x.exercicios_musculacao?.length){await db.from('exercicios_musculacao').insert(x.exercicios_musculacao.map(e=>({treino_id:nid,ordem:e.ordem,exercicio:e.exercicio,grupo_muscular:e.grupo_muscular,series:e.series,repeticoes:e.repeticoes,carga_kg:e.carga_kg,rir:e.rir,rpe:e.rpe,descanso_seg:e.descanso_seg,observacoes:e.observacoes})))}ok++}
  alert(ok+' treino(s) copiado(s).');calendar(0)
}

function brDate(v){if(!v)return '';let [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function nl2br(v){return E(v||'').replace(/\n/g,'<br>')}
function fmtPace(sec){if(!sec)return "—";sec=Math.round(sec);return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}async function feedbacks(){if(P.role==="aluno")return today();let r=await db.from("feedbacks").select("*,alunos(nome),treinos(titulo)").order("created_at",{ascending:false});if(r.error)throw r.error;$("content").innerHTML=`<div class="card"><table><tr><th>Aluno</th><th>Treino</th><th>PSE</th><th>Carga</th><th>Comentário</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${E(x.treinos?.titulo)}</td><td>${x.pse??"—"}</td><td>${x.pse&&x.duracao_real_min?x.pse*x.duracao_real_min+" UA":"—"}</td><td>${E(x.comentario||"")}</td></tr>`).join("")}</table></div>`}
function fb(id){R=null;$('content').innerHTML=`<div class="card" style="max-width:760px"><h2>Concluir treino</h2><p><b>PSE da sessão:</b> como você avalia o esforço geral do treino?</p><div class="rpe">${Array.from({length:11},(_,i)=>`<button id="r${i}" onclick="pick(${i})">${i}</button>`).join('')}</div><p class="muted">0 = repouso • 1–2 = muito leve/leve • 3–4 = moderado • 5–6 = forte • 7–8 = muito forte • 9–10 = extremamente forte/máximo</p><div class="form"><div><label>Duração realizada (min)</label><input id="fd" type="number"></div><div><label>Distância realizada (km) — corrida</label><input id="fkm" type="number" step=".01"></div><div><label>Disposição (1–5)</label><select id="fdisp"><option value="">Selecione</option><option value="1">1 — Muito baixa</option><option value="2">2 — Baixa</option><option value="3">3 — Normal</option><option value="4">4 — Boa</option><option value="5">5 — Muito boa</option></select></div><div><label>Sentiu dor?</label><select id="fpain"><option value="false">Não</option><option value="true">Sim</option></select></div><div class="full"><label>Local da dor (se houver)</label><input id="floc"></div><div class="full"><label>Comentário sobre o treino</label><textarea id="fc" placeholder="Como foi? Conseguiu cumprir? Alguma dificuldade?"></textarea><button class="btn" onclick="saveF('${id}')">Marcar como realizado e enviar</button></div></div></div>`}function pick(n){R=n;document.querySelectorAll('.rpe button').forEach(b=>b.classList.remove('on'));$('r'+n).classList.add('on')}
async function miss(t){let motivo=prompt('Por que a sessão não foi realizada? (opcional)') ;if(motivo===null)return;let payload={treino_id:t,aluno_id:A.id,realizado:false,comentario:motivo||null};let ex=await db.from('feedbacks').select('id').eq('treino_id',t).maybeSingle();let r=ex.data?await db.from('feedbacks').update(payload).eq('id',ex.data.id):await db.from('feedbacks').insert(payload);if(r.error)return alert(r.error.message);let u=await db.from('treinos').update({status:'nao_realizado'}).eq('id',t);if(u.error)return alert(u.error.message);alert('Sessão registrada como não realizada.');go('today')}
async function saveF(t){if(R===null)return alert('Selecione a PSE.');let dur=+$('fd').value||null,km=+$('fkm').value||null;let payload={treino_id:t,aluno_id:A.id,realizado:true,duracao_real_min:dur,pse:R,distancia_real_km:km,pace_real_min_seg:(dur&&km)?Math.round((dur*60)/km):null,comentario:$('fc').value||null,dor:$('fpain').value==='true',dor_local:$('floc').value||null,disposicao:$('fdisp').value===''?null:+$('fdisp').value};let ex=await db.from('feedbacks').select('id').eq('treino_id',t).maybeSingle();let r=ex.data?await db.from('feedbacks').update(payload).eq('id',ex.data.id):await db.from('feedbacks').insert(payload);if(r.error)return alert(r.error.message);await db.from('treinos').update({status:'realizado'}).eq('id',t);alert('Treino marcado como realizado. Feedback enviado!');go('today')}
async function feedbacks(){
  if(P.role==='aluno')return today();
  let r=await db.from('feedbacks').select('*,alunos(nome),treinos(titulo,data_treino,modalidades(nome))').order('created_at',{ascending:false});
  if(r.error)throw r.error;
  const rows=r.data||[];
  $('content').innerHTML=`<div class="section-title"><div><h2 style="margin:0">Central de feedbacks</h2><span class="muted">Analise a resposta do aluno e envie sua orientação.</span></div><span class="badge">${rows.length} registros</span></div><div class="feedback-grid section">${rows.length?rows.map(x=>{const alertFlag=x.dor===true||+(x.pse||0)>=8||(+x.disposicao>0&&+x.disposicao<=2);return `<div class="card feedback-card ${alertFlag?'alert-card':''}"><div class="section-title"><div><span class="pill">${E(x.treinos?.modalidades?.nome||'Treino')}</span><h3>${E(x.alunos?.nome||'Aluno')}</h3><span class="mini">${E(x.treinos?.titulo||'')} • ${brDate(x.treinos?.data_treino)}</span></div>${alertFlag?'<span class="status-tag tag-warn">⚠ Atenção</span>':''}</div><div class="feedback-metrics"><span class="stat">${x.realizado===false?'Não realizado':'Realizado'}</span>${x.pse!==null&&x.pse!==undefined?`<span class="stat">PSE ${x.pse}</span>`:''}${x.duracao_real_min?`<span class="stat">${x.duracao_real_min} min</span>`:''}${x.pse&&x.duracao_real_min?`<span class="stat">${Math.round(x.pse*x.duracao_real_min)} UA</span>`:''}${x.disposicao?`<span class="stat">Disposição ${x.disposicao}/5</span>`:''}</div>${x.dor?`<div class="warn"><b>Dor relatada:</b> ${E(x.dor_local||'local não informado')}</div>`:''}${x.comentario?`<p><b>Feedback do aluno</b><br>${nl2br(x.comentario)}</p>`:'<p class="muted">Sem comentário adicional.</p>'}${x.orientacao_treinadora?`<div class="coach-note"><b>Orientação enviada</b><br>${nl2br(x.orientacao_treinadora)}${x.orientacao_em?`<div class="mini" style="margin-top:6px">${new Date(x.orientacao_em).toLocaleString('pt-BR')}</div>`:''}</div>`:''}<div class="orientation-form"><label>${x.orientacao_treinadora?'Atualizar orientação':'Orientação da treinadora'}</label><textarea id="ori_${x.id}" placeholder="Ex.: reduza a intensidade amanhã, faça mobilidade e me avise se a dor persistir.">${E(x.orientacao_treinadora||'')}</textarea><button class="btn" onclick="saveOrientation('${x.id}')">${x.orientacao_treinadora?'Atualizar orientação':'Enviar orientação'}</button></div></div>`}).join(''):'<div class="card empty">Nenhum feedback recebido ainda.</div>'}</div>`
}
async function saveOrientation(id){const el=$('ori_'+id),txt=(el?.value||'').trim();if(!txt)return alert('Escreva uma orientação antes de enviar.');const {error}=await db.from('feedbacks').update({orientacao_treinadora:txt,orientacao_em:new Date().toISOString(),orientacao_por:U.id}).eq('id',id);if(error)return alert('Não foi possível salvar: '+error.message);alert('Orientação enviada ao aluno.');feedbacks()}
function feedbackArray(v){return Array.isArray(v)?v:(v&&typeof v==='object'?[v]:[])}
let CH=[];function clearCharts(){CH.forEach(c=>{try{c.destroy()}catch(e){}});CH=[]}function mondayISO(v){let d=new Date(v+'T12:00:00'),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
async function progress(mode='geral'){
  clearCharts();let tq=db.from('treinos').select('id,data_treino,duracao_planejada_min,pse_planejada,modalidades(nome),feedbacks(realizado,pse,duracao_real_min,distancia_real_km,pace_real_min_seg,orientacao_treinadora,orientacao_em),treino_corrida(distancia_planejada_km,pace_min_seg,pace_max_seg),exercicios_musculacao(series,repeticoes,carga_kg)');if(P.role==='aluno'){if(!A)return;tq=tq.eq('aluno_id',A.id)}const r=await tq.order('data_treino');if(r.error)throw r.error;let all=r.data||[];let d=all.filter(x=>{let n=(x.modalidades?.nome||'').toLowerCase();return mode==='geral'||(mode==='corrida'&&n.includes('corrida'))||(mode==='musculacao'&&(n.includes('muscula')||n.includes('academia')))});
  const todayISO=new Date().toISOString().slice(0,10),due=d.filter(x=>x.data_treino<=todayISO),planned=due.length,done=due.filter(x=>feedbackArray(x.feedbacks).some(f=>f.realizado===true)).length,missed=due.filter(x=>feedbackArray(x.feedbacks).some(f=>f.realizado===false)||x.status==='nao_realizado').length,adh=planned?Math.round(done/planned*100):0;let km=0,load=0,mins=0;d.forEach(x=>feedbackArray(x.feedbacks).forEach(f=>{if(f.realizado){km+=+(f.distancia_real_km||0);load+=+(f.pse||0)*+(f.duracao_real_min||0);mins+=+(f.duracao_real_min||0)}}));
  const weeks={};d.forEach(x=>{let w=mondayISO(x.data_treino);weeks[w]??={load:0,planned:0,done:0};weeks[w].planned++;feedbackArray(x.feedbacks).forEach(f=>{if(f.realizado){weeks[w].done++;weeks[w].load+=+(f.pse||0)*+(f.duracao_real_min||0)}})});
  const pace=d.filter(x=>(x.modalidades?.nome||'').toLowerCase().includes('corrida')).flatMap(x=>feedbackArray(x.feedbacks).filter(f=>f.realizado&&f.pace_real_min_seg).map(f=>({date:x.data_treino,v:f.pace_real_min_seg})));
  const strength=d.filter(x=>{let n=(x.modalidades?.nome||'').toLowerCase();return n.includes('muscula')||n.includes('academia')}).map(x=>({date:x.data_treino,v:Math.max(0,...(x.exercicios_musculacao||[]).map(e=>+(e.carga_kg||0)))})).filter(x=>x.v>0);
  $('content').innerHTML=`<div class="filterbar"><button class="btn ${mode==='geral'?'':'btn2'}" onclick="progress('geral')">Geral</button><button class="btn ${mode==='corrida'?'':'btn2'}" onclick="progress('corrida')">Corrida</button><button class="btn ${mode==='musculacao'?'':'btn2'}" onclick="progress('musculacao')">Musculação</button></div><div class="grid"><div class="card kpi">Aderência<b>${adh}%</b><span class="mini">${done} realizados • ${missed} não realizados • ${planned} vencidos/hoje</span></div><div class="card kpi">Distância realizada<b>${km.toFixed(1)} km</b></div><div class="card kpi">Carga interna<b>${Math.round(load)} UA</b></div><div class="card kpi">Duração realizada<b>${mins} min</b></div></div><div class="progress-grid section"><div class="card"><div class="section-title"><b>Carga semanal</b><span class="mini">Duração × PSE</span></div><div class="chart-wrap"><canvas id="loadChart"></canvas></div></div><div class="card"><div class="section-title"><b>Planejado × realizado</b><span class="mini">Sessões por semana</span></div><div class="chart-wrap"><canvas id="adhChart"></canvas></div></div>${mode!=='musculacao'?`<div class="card"><div class="section-title"><b>Evolução do pace</b><span class="mini">Pace realizado calculado por duração/distância</span></div><div class="chart-wrap"><canvas id="paceChart"></canvas></div></div>`:''}${mode!=='corrida'?`<div class="card"><div class="section-title"><b>Evolução da carga na musculação</b><span class="mini">Maior carga prescrita (kg) por sessão</span></div><div class="chart-wrap"><canvas id="strengthChart"></canvas></div></div>`:''}</div>`;
  const labels=Object.keys(weeks).sort();const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#bcd0e6'}}},scales:{x:{ticks:{color:'#91a6bf'},grid:{color:'#14283d'}},y:{beginAtZero:true,ticks:{color:'#91a6bf'},grid:{color:'#14283d'}}}};
  if($('loadChart'))CH.push(new Chart($('loadChart'),{type:'bar',data:{labels:labels.map(brDate),datasets:[{label:'Carga (UA)',data:labels.map(k=>Math.round(weeks[k].load))}]},options:opts}));
  if($('adhChart'))CH.push(new Chart($('adhChart'),{type:'bar',data:{labels:labels.map(brDate),datasets:[{label:'Planejados',data:labels.map(k=>weeks[k].planned)},{label:'Realizados',data:labels.map(k=>weeks[k].done)}]},options:opts}));
  if($('paceChart'))CH.push(new Chart($('paceChart'),{type:'line',data:{labels:pace.map(x=>brDate(x.date)),datasets:[{label:'Pace (seg/km)',data:pace.map(x=>x.v),tension:.25}]},options:{...opts,scales:{...opts.scales,y:{...opts.scales.y,beginAtZero:false,ticks:{color:'#91a6bf',callback:v=>fmtPace(v)}}}}}));
  if($('strengthChart'))CH.push(new Chart($('strengthChart'),{type:'line',data:{labels:strength.map(x=>brDate(x.date)),datasets:[{label:'Maior carga prescrita (kg)',data:strength.map(x=>x.v),tension:.25}]},options:opts}));
}

}
