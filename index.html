:root{--b:#050a12;--s:#08111d;--c:#0d1827;--l:#203650;--t:#f5f9ff;--m:#91a6bf;--a:#1688ff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial}button,input,select,textarea{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}.box{width:min(430px,92vw);padding:28px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--a)}label{display:block;color:#bfd0e4;margin:9px 0 5px}input,select,textarea{width:100%;padding:11px;background:#07111e;border:1px solid #294563;border-radius:9px;color:#fff}textarea{min-height:90px}.btn{background:var(--a);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.btn2{background:#17283b}.danger{background:#a82929}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:var(--m)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--s);border-right:1px solid var(--l);padding:22px 16px}.nav{margin-top:22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cad8e8;border:0;padding:11px;border-radius:9px}.nav button:hover{background:#10243b}.main{padding:25px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.badge,.pill{background:#102c49;color:#85c7ff;border-radius:999px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.section{margin-top:14px}.kpi b{display:block;font-size:26px;margin-top:7px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m)}.msg{padding:10px;background:#10243b;border-radius:9px;margin:10px 0}.rpe{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}.rpe button{background:#091523;color:#fff;border:1px solid var(--l);border-radius:8px;padding:9px 2px}.rpe button.on{background:var(--a)}.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}.mode-tab{border:1px solid var(--l);background:#091523;color:#dbe9f7;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.mode-tab.on{background:var(--a);border-color:var(--a);color:#fff}.exercise{background:#08131f;border:1px solid #25415e;border-radius:14px;padding:14px;margin-top:10px}.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.exercise-head b{font-size:15px}.mini{font-size:12px;color:var(--m)}.workout-card{position:relative;overflow:hidden}.workout-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}.workout-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#08131f;border:1px solid #1e3853;border-radius:10px;padding:8px 10px}.workout-title{margin:10px 0 4px}.exercise-list{margin-top:12px;border-top:1px solid var(--l);padding-top:10px}.exercise-item{padding:10px 0;border-bottom:1px solid #172c42}.exercise-item:last-child{border-bottom:0}.exercise-name{font-weight:800;color:#fff}.empty{padding:28px;text-align:center;color:var(--m)}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--l);border-radius:10px;padding:8px;text-align:center}.day input{width:auto}.ok{background:#0c2c22;border:1px solid #1d624c;padding:10px;border-radius:10px}.warn{background:#30250d;border:1px solid #725719;padding:10px;border-radius:10px}.calrow{display:flex;gap:6px;flex-wrap:wrap}.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.rpe{grid-template-columns:repeat(4,1fr)}}</style></head><body>
<div id="login" class="login"><div class="box"><div class="brand">PerformancePro <span>Trainning</span></div><h1>Entrar</h1><div id="msg"></div><label>E-mail</label><input id="email"><label>Senha</label><input id="pass" type="password"><br><br><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div>

<script>
const db=supabase.createClient("https://iuynmlcqthdzassbazag.supabase.co","sb_publishable_a6J4GrkdHU_YJrM-KR4x8Q_0UB_x4AX");let U,P,A,R=null;const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const M=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function login(){try{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error;U=r.data.user;await enter()}catch(e){$("msg").innerHTML='<div class="msg">'+E(e.message)+'</div>'}}
async function enter(){let r=await db.from("profiles").select("*").eq("id",U.id).single();if(r.error)throw r.error;P=r.data;if(P.role==="aluno"){let x=await db.from("alunos").select("*").eq("user_id",U.id).maybeSingle();A=x.data}$("login").classList.add("hide");$("app").classList.remove("hide");$("hello").textContent="Olá, "+(P.nome||U.email);$("role").textContent=P.role==="admin"?"Admin":"Aluno";nav();go(P.role==="admin"?"dashboard":"today")}
function nav(){let n=P.role==="admin"?[["dashboard","Dashboard"],["students","Alunos"],["prescribe","Prescrever"],["calendar","Calendário"],["feedbacks","Feedbacks"],["progress","Evolução"],["finance","Financeiro"]]:[["today","Meus treinos"],["calendar","Calendário"],["feedbacks","Feedback"],["progress","Minha evolução"],["password","Alterar senha"]];$("nav").innerHTML=n.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")+'<button onclick="out()">Sair</button>'}
async function out(){await db.auth.signOut();location.reload()}async function go(p){let N={dashboard:"Dashboard",students:"Alunos",prescribe:"Prescrever treino",calendar:"Calendário",feedbacks:"Feedbacks",progress:"Evolução",finance:"Financeiro",today:"Meus treinos",password:"Alterar senha"};$("title").textContent=N[p];$("content").innerHTML='<div class="card">Carregando...</div>';try{await ({dashboard,students,prescribe,calendar,feedbacks,progress,finance,today,password}[p])()}catch(e){$("content").innerHTML='<div class="card">'+E(e.message)+'</div>'}}
async function dashboard(){let[a,t,f,p]=await Promise.all([db.from("alunos").select("id",{count:"exact"}).eq("ativo",true),db.from("treinos").select("id",{count:"exact"}),db.from("feedbacks").select("id",{count:"exact"}),db.from("pagamentos").select("valor,status")]);let rec=(p.data||[]).filter(x=>x.status==="pago").reduce((s,x)=>s+ +x.valor,0);$("content").innerHTML=`<div class="grid"><div class="card kpi">Alunos<b>${a.count||0}</b></div><div class="card kpi">Treinos<b>${t.count||0}</b></div><div class="card kpi">Feedbacks<b>${f.count||0}</b></div><div class="card kpi">Recebido<b>${M(rec)}</b></div></div>`}
async function students(){let r=await db.from("alunos").select("*").order("nome");if(r.error)throw r.error;$('content').innerHTML=`<div class="card"><h2>Novo aluno</h2><p class="muted">O cadastro cria a ficha e a conta de acesso imediatamente. A senha provisória será exibida uma única vez.</p><div id="studentMsg"></div><div class="form"><div><label>Nome</label><input id="an"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Telefone</label><input id="at"></div><div><label>Observações</label><input id="ao"></div><div class="full"><button id="addBtn" class="btn" onclick="addA()">Cadastrar aluno</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.nome)}</td><td>${E(x.email||'—')}</td><td>${x.ativo?'Ativo':'Inativo'}</td><td><div class="actions"><button class="btn btn2" onclick="toggleA('${x.id}',${x.ativo})">${x.ativo?'Desativar':'Reativar'}</button><button class="btn danger" onclick="deleteA('${x.id}','${encodeURIComponent(x.nome||'Aluno')}')">Excluir</button></div></td></tr>`).join('')}</table></div>`}
async function addA(){let nome=$('an').value.trim(),email=$('ae').value.trim(),telefone=$('at').value.trim(),observacoes=$('ao').value.trim();if(!nome||!email)return alert('Informe nome e e-mail.');let b=$('addBtn');b.disabled=true;b.textContent='Cadastrando...';try{let {data,error}=await db.functions.invoke('criar-aluno',{body:{nome,email,telefone,observacoes}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao cadastrar aluno.');if(data?.acesso?.senha_temporaria){alert('ALUNO CADASTRADO!\n\nLogin: '+data.acesso.email+'\nSenha provisória: '+data.acesso.senha_temporaria+'\n\nCopie estes dados agora. A senha não será exibida novamente.')}else{alert(data?.message||'Aluno cadastrado com sucesso.')}await students()}catch(e){alert('Não foi possível cadastrar: '+(e.message||e))}finally{if($('addBtn')){$('addBtn').disabled=false;$('addBtn').textContent='Cadastrar aluno'}}}
async function toggleA(id,ativo){let acao=ativo?'desativar':'reativar';if(!confirm(`Deseja ${acao} este aluno? O histórico será preservado.`))return;let r=await db.from('alunos').update({ativo:!ativo}).eq('id',id);if(r.error)return alert(r.error.message);alert(ativo?'Aluno desativado.':'Aluno reativado.');students()}
async function deleteA(id,nome){nome=decodeURIComponent(nome);let ok=prompt(`EXCLUSÃO DEFINITIVA\n\nIsso excluirá a conta de acesso e os dados vinculados do aluno ${nome}.\n\nPara confirmar, digite EXCLUIR:`);if(ok!=='EXCLUIR')return;try{let {data,error}=await db.functions.invoke('excluir-aluno',{body:{aluno_id:id}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao excluir aluno.');alert(data?.message||'Aluno excluído.');students()}catch(e){alert('Não foi possível excluir: '+(e.message||e))}}
async function lists(){let[a,m]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("modalidades").select("id,nome").eq("ativo",true)]);return[a.data||[],m.data||[]]}
let EDIT_T=null;
async function prescribe(editId=null){EDIT_T=editId;let[a,m]=await lists();$('content').innerHTML=`<div class="card"><h2>${editId?'Editar treino':'Nova prescrição'}</h2><p class="muted">Corrida e musculação podem ser prescritas para o mesmo aluno. Para montar a semana, salve o treino e use “Duplicar” no calendário para criar as outras sessões rapidamente.</p><div class="form"><div><label>Aluno</label><select id="ps">${a.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Modalidade</label><select id="pm" onchange="modeFields()">${m.map(x=>`<option value="${x.id}" data-name="${E(x.nome)}">${E(x.nome)}</option>`)}</select></div><div><label>Data</label><input id="pd" type="date"></div><div><label>Título</label><input id="pt" placeholder="Ex.: Rodagem Z2 / Treino A - Inferiores"></div><div><label>Tipo</label><input id="pty" placeholder="Contínuo, Intervalado, Força, Hipertrofia..."></div><div><label>Duração planejada (min)</label><input id="pmin" type="number" min="0"></div><div><label>PSE prevista (0–10)</label><input id="ppse" type="number" min="0" max="10"></div><div><label>Objetivo</label><input id="pobj"></div><div id="runFields" class="full hide"><div class="card" style="background:#091523"><h3>🏃 Corrida</h3><div class="form"><div><label>Distância (km)</label><input id="rdist" type="number" step=".01"></div><div><label>Zona</label><input id="rzone" placeholder="Z1, Z2, Z3..."></div><div><label>Pace mais rápido (min/km)</label><input id="rpmin" type="time" step="1"></div><div><label>Pace mais lento (min/km)</label><input id="rpmax" type="time" step="1"></div><div class="full"><label>Estrutura</label><textarea id="rstruct" placeholder="10 min aquecimento + 6 x 400 m... "></textarea></div></div></div></div><div id="gymFields" class="full hide"><div class="card" style="background:#091523"><div class="exercise-head"><div><h3 style="margin:0">🏋️ Musculação</h3><span class="mini">Exercícios na ordem de execução.</span></div><button type="button" class="btn" onclick="addExercise()">+ Exercício</button></div><div id="exerciseBox"></div></div></div><div class="full"><label>Observações gerais</label><textarea id="pobs"></textarea><br><button id="saveTBtn" class="btn" onclick="saveT()">${editId?'Salvar alterações':'Salvar treino'}</button></div></div></div>`;$('pd').value=new Date().toISOString().slice(0,10);modeFields();if(editId)await loadEdit(editId)}
function currentMode(){let s=$('pm');return (s?.options[s.selectedIndex]?.dataset.name||'').toLowerCase()}
function modeFields(){let n=currentMode(),run=n.includes('corrida'),gym=n.includes('muscula')||n.includes('academia');$('runFields')?.classList.toggle('hide',!run);$('gymFields')?.classList.toggle('hide',!gym);if(gym&&$('exerciseBox')&&!$('exerciseBox').children.length)addExercise()}
let EXN=0;function addExercise(z={}){EXN++;let d=document.createElement('div');d.className='exercise';d.dataset.ex='1';d.innerHTML=`<div class="exercise-head"><b>Exercício <span class="exnum">${document.querySelectorAll('[data-ex]').length+1}</span></b><button type="button" class="btn danger" onclick="this.closest('[data-ex]').remove();renumberExercises()">Remover</button></div><div class="form"><div><label>Exercício</label><input class="ex-name" value="${E(z.exercicio||'')}"></div><div><label>Grupo muscular</label><input class="ex-group" value="${E(z.grupo_muscular||'')}"></div><div><label>Séries</label><input class="ex-series" type="number" value="${z.series??''}"></div><div><label>Repetições</label><input class="ex-reps" value="${E(z.repeticoes||'')}"></div><div><label>Carga (kg)</label><input class="ex-kg" type="number" step=".5" value="${z.carga_kg??''}"></div><div><label>RIR</label><input class="ex-rir" type="number" min="0" max="10" value="${z.rir??''}"></div><div><label>RPE</label><input class="ex-rpe" type="number" min="0" max="10" value="${z.rpe??''}"></div><div><label>Descanso (seg)</label><input class="ex-rest" type="number" value="${z.descanso_seg??''}"></div><div class="full"><label>Orientações</label><input class="ex-obs" value="${E(z.observacoes||'')}"></div></div>`;$('exerciseBox').appendChild(d);renumberExercises()}
function renumberExercises(){document.querySelectorAll('[data-ex]').forEach((x,i)=>x.querySelector('.exnum').textContent=i+1)}
function exerciseRows(){return [...document.querySelectorAll('[data-ex]')].map((x,i)=>({ordem:i+1,exercicio:x.querySelector('.ex-name').value.trim(),grupo_muscular:x.querySelector('.ex-group').value.trim()||null,series:+x.querySelector('.ex-series').value||null,repeticoes:x.querySelector('.ex-reps').value.trim()||null,carga_kg:x.querySelector('.ex-kg').value===''?null:+x.querySelector('.ex-kg').value,rir:x.querySelector('.ex-rir').value===''?null:+x.querySelector('.ex-rir').value,rpe:x.querySelector('.ex-rpe').value===''?null:+x.querySelector('.ex-rpe').value,descanso_seg:+x.querySelector('.ex-rest').value||null,observacoes:x.querySelector('.ex-obs').value.trim()||null})).filter(x=>x.exercicio)}
function paceSec(v){if(!v)return null;let p=v.split(':').map(Number);return p[0]*60+(p[1]||0)+(p[2]||0)/60}function paceInput(sec){if(!sec)return '';sec=Math.round(sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
async function loadEdit(id){let r=await db.from('treinos').select('*,treino_corrida(*),exercicios_musculacao(*)').eq('id',id).single();if(r.error)throw r.error;let x=r.data;$('ps').value=x.aluno_id;$('pm').value=x.modalidade_id;$('pd').value=x.data_treino;$('pt').value=x.titulo||'';$('pty').value=x.tipo||'';$('pmin').value=x.duracao_planejada_min??'';$('ppse').value=x.pse_planejada??'';$('pobj').value=x.objetivo||'';$('pobs').value=x.observacoes||'';modeFields();let c=Array.isArray(x.treino_corrida)?x.treino_corrida[0]:x.treino_corrida;if(c){$('rdist').value=c.distancia_km??'';$('rzone').value=c.zona||'';$('rpmin').value=paceInput(c.pace_min_seg);$('rpmax').value=paceInput(c.pace_max_seg);$('rstruct').value=c.estrutura||''}if((x.exercicios_musculacao||[]).length){$('exerciseBox').innerHTML='';x.exercicios_musculacao.sort((a,b)=>(a.ordem||0)-(b.ordem||0)).forEach(addExercise)}}
async function saveT(){let mod=$('pm'),modName=currentMode(),isRun=modName.includes('corrida'),isGym=modName.includes('muscula')||modName.includes('academia');let p={aluno_id:$('ps').value,modalidade_id:mod.value,data_treino:$('pd').value,titulo:$('pt').value.trim(),tipo:$('pty').value.trim(),duracao_planejada_min:+$('pmin').value||null,pse_planejada:$('ppse').value===''?null:+$('ppse').value,objetivo:$('pobj').value.trim(),observacoes:$('pobs').value.trim(),criado_por:U.id};if(!p.aluno_id||!p.modalidade_id||!p.data_treino||!p.titulo)return alert('Preencha aluno, modalidade, data e título.');let ex=isGym?exerciseRows():[];if(isGym&&!ex.length)return alert('Adicione pelo menos um exercício.');let b=$('saveTBtn');b.disabled=true;b.textContent='Salvando...';let treinoId=EDIT_T;try{if(EDIT_T){let r=await db.from('treinos').update(p).eq('id',EDIT_T);if(r.error)throw r.error;await db.from('treino_corrida').delete().eq('treino_id',EDIT_T);await db.from('exercicios_musculacao').delete().eq('treino_id',EDIT_T)}else{let r=await db.from('treinos').insert(p).select('id').single();if(r.error)throw r.error;treinoId=r.data.id}if(isRun){let min=paceSec($('rpmin').value),max=paceSec($('rpmax').value);if(min&&max&&min>max)throw new Error('O pace mais rápido deve ser menor que o pace mais lento.');let rr=await db.from('treino_corrida').insert({treino_id:treinoId,distancia_km:+$('rdist').value||null,pace_min_seg:min?Math.round(min):null,pace_max_seg:max?Math.round(max):null,zona:$('rzone').value.trim()||null,estrutura:$('rstruct').value.trim()||null});if(rr.error)throw rr.error}if(isGym){let gr=await db.from('exercicios_musculacao').insert(ex.map(x=>({...x,treino_id:treinoId})));if(gr.error)throw gr.error}alert(EDIT_T?'Treino atualizado.':'Treino salvo.');EDIT_T=null;go('calendar')}catch(e){if(!EDIT_T&&treinoId)await db.from('treinos').delete().eq('id',treinoId);alert('Não foi possível salvar: '+(e.message||e));b.disabled=false;b.textContent=EDIT_T?'Salvar alterações':'Salvar treino'}}
async function duplicateT(id){let data=prompt('Data do treino duplicado (AAAA-MM-DD):',new Date().toISOString().slice(0,10));if(!data)return;let r=await db.from('treinos').select('*,treino_corrida(*),exercicios_musculacao(*)').eq('id',id).single();if(r.error)return alert(r.error.message);let x=r.data,base={aluno_id:x.aluno_id,modalidade_id:x.modalidade_id,data_treino:data,titulo:x.titulo,tipo:x.tipo,duracao_planejada_min:x.duracao_planejada_min,pse_planejada:x.pse_planejada,objetivo:x.objetivo,observacoes:x.observacoes,criado_por:U.id};let n=await db.from('treinos').insert(base).select('id').single();if(n.error)return alert(n.error.message);let nid=n.data.id,c=Array.isArray(x.treino_corrida)?x.treino_corrida[0]:x.treino_corrida;if(c){let {id:_,treino_id:__,...rest}=c;let z=await db.from('treino_corrida').insert({...rest,treino_id:nid});if(z.error)return alert(z.error.message)}if((x.exercicios_musculacao||[]).length){let rows=x.exercicios_musculacao.map(z=>{let{id:_,treino_id:__,...rest}=z;return{...rest,treino_id:nid}});let q=await db.from('exercicios_musculacao').insert(rows);if(q.error)return alert(q.error.message)}alert('Treino duplicado.');calendar()}
async function deleteT(id){if(!confirm('Excluir este treino? Esta ação remove também a prescrição específica e o feedback vinculado.'))return;let f=await db.from('feedbacks').delete().eq('treino_id',id);if(f.error)return alert(f.error.message);await db.from('treino_corrida').delete().eq('treino_id',id);await db.from('exercicios_musculacao').delete().eq('treino_id',id);let r=await db.from('treinos').delete().eq('id',id);if(r.error)return alert(r.error.message);alert('Treino excluído.');calendar()}
async function calendar(){let q=db.from("treinos").select("id,data_treino,titulo,tipo,status,alunos(nome),modalidades(nome)").order("data_treino",{ascending:false});if(P.role==="aluno"&&A)q=q.eq("aluno_id",A.id);let r=await q;if(r.error)throw r.error;let rows=r.data||[];$('content').innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><div><h2 style="margin:0">Agenda de treinos</h2><span class="muted">${rows.length} treino(s)</span></div>${P.role==='admin'?'<button class="btn" onclick="go(\'prescribe\')">+ Novo treino</button>':''}</div></div><div class="card section"><table><tr><th>Data</th>${P.role==='admin'?'<th>Aluno</th>':''}<th>Modalidade</th><th>Treino</th><th>Status</th>${P.role==='admin'?'<th>Ações</th>':''}</tr>${rows.map(x=>`<tr><td><b>${brDate(x.data_treino)}</b></td>${P.role==='admin'?`<td>${E(x.alunos?.nome)}</td>`:''}<td><span class="pill">${E(x.modalidades?.nome)}</span></td><td>${E(x.titulo)}</td><td>${E(x.status||'prescrito')}</td>${P.role==='admin'?`<td><div class="calrow"><button class="btn btn2" onclick="prescribe('${x.id}')">Editar</button><button class="btn btn2" onclick="duplicateT('${x.id}')">Duplicar</button><button class="btn danger" onclick="deleteT('${x.id}')">Excluir</button></div></td>`:''}</tr>`).join('')}</table></div>`}
async function today(){if(!A){$("content").innerHTML='<div class="card">Seu login ainda não foi vinculado à ficha de aluno.</div>';return}let r=await db.from("treinos").select("id,data_treino,titulo,tipo,objetivo,observacoes,duracao_planejada_min,pse_planejada,status,modalidades(nome),treino_corrida(distancia_km,pace_min_seg,pace_max_seg,zona,estrutura),exercicios_musculacao(ordem,exercicio,grupo_muscular,series,repeticoes,carga_kg,rir,rpe,descanso_seg,observacoes)").eq("aluno_id",A.id).order("data_treino",{ascending:false});if(r.error)throw r.error;let rows=r.data||[];if(!rows.length){$("content").innerHTML='<div class="card empty">Nenhum treino prescrito ainda.</div>';return}$("content").innerHTML=`<div class="grid">${rows.map(x=>{let ex=(x.exercicios_musculacao||[]).sort((a,b)=>(a.ordem||0)-(b.ordem||0));return `<div class="card workout-card"><div class="workout-meta"><span class="pill">${E(x.modalidades?.nome)}</span><span class="stat">📅 ${brDate(x.data_treino)}</span>${x.duracao_planejada_min?`<span class="stat">⏱ ${x.duracao_planejada_min} min</span>`:''}${x.pse_planejada!==null&&x.pse_planejada!==undefined?`<span class="stat">PSE ${x.pse_planejada}</span>`:''}</div><h2 class="workout-title">${E(x.titulo)}</h2>${x.tipo?`<div class="muted">${E(x.tipo)}</div>`:''}${x.objetivo?`<p><b>Objetivo:</b> ${E(x.objetivo)}</p>`:''}${x.treino_corrida?`<div class="exercise-list"><b>🏃 Corrida</b><div class="workout-meta">${x.treino_corrida.distancia_km?`<span class="stat">${x.treino_corrida.distancia_km} km</span>`:''}<span class="stat">Pace ${fmtPace(x.treino_corrida.pace_min_seg)}${x.treino_corrida.pace_max_seg?'–'+fmtPace(x.treino_corrida.pace_max_seg):''}/km</span>${x.treino_corrida.zona?`<span class="stat">${E(x.treino_corrida.zona)}</span>`:''}</div>${x.treino_corrida.estrutura?`<p><b>Estrutura:</b><br>${nl2br(x.treino_corrida.estrutura)}</p>`:''}</div>`:''}${ex.length?`<div class="exercise-list"><b>🏋️ Exercícios</b>${ex.map((z,i)=>`<div class="exercise-item"><div class="exercise-name">${i+1}. ${E(z.exercicio)}</div>${z.grupo_muscular?`<div class="mini">${E(z.grupo_muscular)}</div>`:''}<div class="workout-meta">${z.series?`<span class="stat">${z.series} séries</span>`:''}${z.repeticoes?`<span class="stat">${E(z.repeticoes)} reps</span>`:''}${z.carga_kg!==null&&z.carga_kg!==undefined?`<span class="stat">${z.carga_kg} kg</span>`:''}${z.rir!==null&&z.rir!==undefined?`<span class="stat">RIR ${z.rir}</span>`:''}${z.rpe!==null&&z.rpe!==undefined?`<span class="stat">RPE ${z.rpe}</span>`:''}${z.descanso_seg?`<span class="stat">Descanso ${z.descanso_seg}s</span>`:''}</div>${z.observacoes?`<div class="mini">${E(z.observacoes)}</div>`:''}</div>`).join('')}</div>`:''}${x.observacoes?`<p><b>Observações:</b><br>${nl2br(x.observacoes)}</p>`:''}<button class="btn" onclick="fb('${x.id}')">Enviar feedback</button></div>`}).join('')}</div>`}
function brDate(v){if(!v)return '';let [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function nl2br(v){return E(v||'').replace(/\n/g,'<br>')}
function fmtPace(sec){if(!sec)return "—";sec=Math.round(sec);return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}async function feedbacks(){if(P.role==="aluno")return today();let r=await db.from("feedbacks").select("*,alunos(nome),treinos(titulo)").order("created_at",{ascending:false});if(r.error)throw r.error;$("content").innerHTML=`<div class="card"><table><tr><th>Aluno</th><th>Treino</th><th>PSE</th><th>Carga</th><th>Comentário</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${E(x.treinos?.titulo)}</td><td>${x.pse??"—"}</td><td>${x.pse&&x.duracao_real_min?x.pse*x.duracao_real_min+" UA":"—"}</td><td>${E(x.comentario||"")}</td></tr>`).join("")}</table></div>`}
function fb(id){R=null;$('content').innerHTML=`<div class="card" style="max-width:760px"><h2>Concluir treino</h2><p><b>PSE da sessão:</b> como você avalia o esforço geral do treino?</p><div class="rpe">${Array.from({length:11},(_,i)=>`<button id="r${i}" onclick="pick(${i})">${i}</button>`).join('')}</div><p class="muted">0 = repouso • 1–2 = muito leve/leve • 3–4 = moderado • 5–6 = forte • 7–8 = muito forte • 9–10 = extremamente forte/máximo</p><div class="form"><div><label>Duração realizada (min)</label><input id="fd" type="number"></div><div><label>Distância realizada (km) — corrida</label><input id="fkm" type="number" step=".01"></div><div><label>Disposição (0–10)</label><input id="fdisp" type="number" min="0" max="10"></div><div><label>Sentiu dor?</label><select id="fpain"><option value="false">Não</option><option value="true">Sim</option></select></div><div class="full"><label>Local da dor (se houver)</label><input id="floc"></div><div class="full"><label>Comentário sobre o treino</label><textarea id="fc" placeholder="Como foi? Conseguiu cumprir? Alguma dificuldade?"></textarea><button class="btn" onclick="saveF('${id}')">Marcar como realizado e enviar</button></div></div></div>`}function pick(n){R=n;document.querySelectorAll('.rpe button').forEach(b=>b.classList.remove('on'));$('r'+n).classList.add('on')}
async function saveF(t){if(R===null)return alert('Selecione a PSE.');let payload={treino_id:t,aluno_id:A.id,realizado:true,duracao_real_min:+$('fd').value||null,pse:R,distancia_real_km:+$('fkm').value||null,comentario:$('fc').value||null,dor:$('fpain').value==='true',local_dor:$('floc').value||null,disposicao:$('fdisp').value===''?null:+$('fdisp').value};let r=await db.from('feedbacks').upsert(payload,{onConflict:'treino_id'});if(r.error)return alert(r.error.message);alert('Treino marcado como realizado. Feedback enviado!');go('today')}
async function feedbacks(){if(P.role==='aluno')return today();let r=await db.from('feedbacks').select('*,alunos(nome),treinos(titulo,modalidades(nome))').order('created_at',{ascending:false});if(r.error)throw r.error;$('content').innerHTML=`<div class="card"><table><tr><th>Aluno</th><th>Modalidade</th><th>Treino</th><th>PSE</th><th>Carga</th><th>Feedback</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${E(x.treinos?.modalidades?.nome||'—')}</td><td>${E(x.treinos?.titulo)}</td><td>${x.pse??'—'}</td><td>${x.pse&&x.duracao_real_min?x.pse*x.duracao_real_min+' UA':'—'}</td><td>${E(x.comentario||'')}</td></tr>`).join('')}</table></div>`}
async function progress(mode='geral'){let q=db.from('feedbacks').select('pse,duracao_real_min,distancia_real_km,realizado,treinos(modalidades(nome))');if(P.role==='aluno'){if(!A)return;q=q.eq('aluno_id',A.id)}let r=await q;if(r.error)throw r.error;let all=r.data||[],d=all.filter(x=>{let n=(x.treinos?.modalidades?.nome||'').toLowerCase();return mode==='geral'||(mode==='corrida'&&n.includes('corrida'))||(mode==='musculacao'&&(n.includes('muscula')||n.includes('academia')))}),km=d.reduce((s,x)=>s+ +(x.distancia_real_km||0),0),load=d.reduce((s,x)=>s+ +(x.pse||0)* +(x.duracao_real_min||0),0),mins=d.reduce((s,x)=>s+ +(x.duracao_real_min||0),0);$('content').innerHTML=`<div class="filterbar"><button class="btn ${mode==='geral'?'':'btn2'}" onclick="progress('geral')">Geral</button><button class="btn ${mode==='corrida'?'':'btn2'}" onclick="progress('corrida')">Corrida</button><button class="btn ${mode==='musculacao'?'':'btn2'}" onclick="progress('musculacao')">Musculação</button></div><div class="grid"><div class="card kpi">Sessões realizadas<b>${d.length}</b></div><div class="card kpi">${mode==='musculacao'?'Volume corrida':'Distância'}<b>${km.toFixed(1)} km</b></div><div class="card kpi">Carga interna<b>${Math.round(load)} UA</b></div><div class="card kpi">Duração<b>${mins} min</b></div></div><div class="card section"><b>Carga interna</b><p class="muted">Calculada como duração realizada × PSE da sessão.</p></div>`}
async function finance(){let[a,p]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("pagamentos").select("*,alunos(nome)").order("vencimento",{ascending:false})]);if(p.error)throw p.error;$("content").innerHTML=`<div class="card"><div class="form"><div><label>Aluno</label><select id="fs">${(a.data||[]).map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Valor</label><input id="fv" type="number"></div><div><label>Referência</label><input id="fr" type="date"></div><div><label>Vencimento</label><input id="fven" type="date"></div><div><label>Status</label><select id="fst"><option>pendente</option><option>pago</option><option>atrasado</option></select></div><div><label>Forma</label><input id="ff"></div><div class="full"><button class="btn" onclick="saveP()">Salvar cobrança</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr>${(p.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${M(x.valor)}</td><td>${x.vencimento}</td><td>${x.status}</td></tr>`).join("")}</table></div>`}
async function saveP(){let r=await db.from("pagamentos").insert({aluno_id:$("fs").value,valor:+$("fv").value,referencia:$("fr").value,vencimento:$("fven").value,status:$("fst").value,forma_pagamento:$("ff").value||null,data_pagamento:$("fst").value==="pago"?new Date().toISOString().slice(0,10):null});if(r.error)throw r.error;go("finance")}
(async()=>{let r=await db.auth.getSession();if(r.data.session){U=r.data.session.user;await enter()}})();
