<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PerformancePro Trainning</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--b:#050a12;--s:#08111d;--c:#0d1827;--l:#203650;--t:#f5f9ff;--m:#91a6bf;--a:#1688ff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial}button,input,select,textarea{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}.box{width:min(430px,92vw);padding:28px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--a)}label{display:block;color:#bfd0e4;margin:9px 0 5px}input,select,textarea{width:100%;padding:11px;background:#07111e;border:1px solid #294563;border-radius:9px;color:#fff}textarea{min-height:90px}.btn{background:var(--a);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.btn2{background:#17283b}.danger{background:#a82929}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:var(--m)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--s);border-right:1px solid var(--l);padding:22px 16px}.nav{margin-top:22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cad8e8;border:0;padding:11px;border-radius:9px}.nav button:hover{background:#10243b}.main{padding:25px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.badge,.pill{background:#102c49;color:#85c7ff;border-radius:999px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.section{margin-top:14px}.kpi b{display:block;font-size:26px;margin-top:7px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m)}.msg{padding:10px;background:#10243b;border-radius:9px;margin:10px 0}.rpe{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}.rpe button{background:#091523;color:#fff;border:1px solid var(--l);border-radius:8px;padding:9px 2px}.rpe button.on{background:var(--a)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.rpe{grid-template-columns:repeat(4,1fr)}}</style></head><body>
<div id="login" class="login"><div class="box"><div class="brand">PerformancePro <span>Trainning</span></div><h1>Entrar</h1><div id="msg"></div><label>E-mail</label><input id="email"><label>Senha</label><input id="pass" type="password"><br><br><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div>
<div id="app" class="app hide"><aside class="side"><div class="brand">PerformancePro <span>Trainning</span></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title"></h1><span id="hello" class="muted"></span></div><span id="role" class="badge"></span></div><div id="content"></div></main></div>
<script>
const db=supabase.createClient("https://iuynmlcqthdzassbazag.supabase.co","sb_publishable_a6J4GrkdHU_YJrM-KR4x8Q_0UB_x4AX");let U,P,A,R=null;const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const M=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function login(){try{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error;U=r.data.user;await enter()}catch(e){$("msg").innerHTML='<div class="msg">'+E(e.message)+'</div>'}}
async function enter(){let r=await db.from("profiles").select("*").eq("id",U.id).single();if(r.error)throw r.error;P=r.data;if(P.role==="aluno"){let x=await db.from("alunos").select("*").eq("user_id",U.id).maybeSingle();A=x.data}$("login").classList.add("hide");$("app").classList.remove("hide");$("hello").textContent="Olá, "+(P.nome||U.email);$("role").textContent=P.role==="admin"?"Admin":"Aluno";nav();go(P.role==="admin"?"dashboard":"today")}
function nav(){let n=P.role==="admin"?[["dashboard","Dashboard"],["students","Alunos"],["prescribe","Prescrever"],["calendar","Calendário"],["feedbacks","Feedbacks"],["progress","Evolução"],["finance","Financeiro"]]:[["today","Meus treinos"],["calendar","Calendário"],["feedbacks","Feedback"],["progress","Minha evolução"]];$("nav").innerHTML=n.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")+'<button onclick="out()">Sair</button>'}
async function out(){await db.auth.signOut();location.reload()}async function go(p){let N={dashboard:"Dashboard",students:"Alunos",prescribe:"Prescrever treino",calendar:"Calendário",feedbacks:"Feedbacks",progress:"Evolução",finance:"Financeiro",today:"Meus treinos"};$("title").textContent=N[p];$("content").innerHTML='<div class="card">Carregando...</div>';try{await ({dashboard,students,prescribe,calendar,feedbacks,progress,finance,today}[p])()}catch(e){$("content").innerHTML='<div class="card">'+E(e.message)+'</div>'}}
async function dashboard(){let[a,t,f,p]=await Promise.all([db.from("alunos").select("id",{count:"exact"}).eq("ativo",true),db.from("treinos").select("id",{count:"exact"}),db.from("feedbacks").select("id",{count:"exact"}),db.from("pagamentos").select("valor,status")]);let rec=(p.data||[]).filter(x=>x.status==="pago").reduce((s,x)=>s+ +x.valor,0);$("content").innerHTML=`<div class="grid"><div class="card kpi">Alunos<b>${a.count||0}</b></div><div class="card kpi">Treinos<b>${t.count||0}</b></div><div class="card kpi">Feedbacks<b>${f.count||0}</b></div><div class="card kpi">Recebido<b>${M(rec)}</b></div></div>`}
async function students(){let r=await db.from("alunos").select("*").order("nome");if(r.error)throw r.error;$('content').innerHTML=`<div class="card"><h2>Novo aluno</h2><p class="muted">O cadastro cria a ficha, vincula a conta e envia o convite de acesso por e-mail.</p><div id="studentMsg"></div><div class="form"><div><label>Nome</label><input id="an"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Telefone</label><input id="at"></div><div><label>Observações</label><input id="ao"></div><div class="full"><button id="addBtn" class="btn" onclick="addA()">Cadastrar e enviar acesso</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.nome)}</td><td>${E(x.email||'—')}</td><td>${x.ativo?'Ativo':'Inativo'}</td><td><div class="actions"><button class="btn btn2" onclick="toggleA('${x.id}',${x.ativo})">${x.ativo?'Desativar':'Reativar'}</button><button class="btn danger" onclick="deleteA('${x.id}','${encodeURIComponent(x.nome||'Aluno')}')">Excluir</button></div></td></tr>`).join('')}</table></div>`}
async function addA(){let nome=$('an').value.trim(),email=$('ae').value.trim(),telefone=$('at').value.trim(),observacoes=$('ao').value.trim();if(!nome||!email)return alert('Informe nome e e-mail.');let b=$('addBtn');b.disabled=true;b.textContent='Cadastrando...';try{let {data,error}=await db.functions.invoke('criar-aluno',{body:{nome,email,telefone,observacoes}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao cadastrar aluno.');alert(data?.message||'Aluno cadastrado e convite enviado.');await students()}catch(e){alert('Não foi possível cadastrar: '+(e.message||e))}finally{if($('addBtn')){$('addBtn').disabled=false;$('addBtn').textContent='Cadastrar e enviar acesso'}}}
async function toggleA(id,ativo){let acao=ativo?'desativar':'reativar';if(!confirm(`Deseja ${acao} este aluno? O histórico será preservado.`))return;let r=await db.from('alunos').update({ativo:!ativo}).eq('id',id);if(r.error)return alert(r.error.message);alert(ativo?'Aluno desativado.':'Aluno reativado.');students()}
async function deleteA(id,nome){nome=decodeURIComponent(nome);let ok=prompt(`EXCLUSÃO DEFINITIVA\n\nIsso excluirá a conta de acesso e os dados vinculados do aluno ${nome}.\n\nPara confirmar, digite EXCLUIR:`);if(ok!=='EXCLUIR')return;try{let {data,error}=await db.functions.invoke('excluir-aluno',{body:{aluno_id:id}});if(error)throw error;if(data?.success===false)throw new Error(data.error||'Erro ao excluir aluno.');alert(data?.message||'Aluno excluído.');students()}catch(e){alert('Não foi possível excluir: '+(e.message||e))}}
async function lists(){let[a,m]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("modalidades").select("id,nome").eq("ativo",true)]);return[a.data||[],m.data||[]]}
async function prescribe(){let[a,m]=await lists();$('content').innerHTML=`<div class="card"><div class="form"><div><label>Aluno</label><select id="ps">${a.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Modalidade</label><select id="pm" onchange="modeFields()">${m.map(x=>`<option value="${x.id}" data-name="${E(x.nome)}">${E(x.nome)}</option>`)}</select></div><div><label>Data</label><input id="pd" type="date"></div><div><label>Título</label><input id="pt"></div><div><label>Tipo</label><input id="pty"></div><div><label>Duração planejada (min)</label><input id="pmin" type="number" min="0"></div><div><label>PSE prevista</label><input id="ppse" type="number" min="0" max="10"></div><div><label>Objetivo</label><input id="pobj"></div><div id="runFields" class="full hide"><div class="form"><div><label>Distância planejada (km)</label><input id="rdist" type="number" min="0" step="0.01"></div><div><label>Zona de intensidade</label><input id="rzone" placeholder="Ex.: Z2, Z3, Z4"></div><div><label>Pace alvo mínimo (min/km)</label><input id="rpmin" type="time" step="1" placeholder="05:20"></div><div><label>Pace alvo máximo (min/km)</label><input id="rpmax" type="time" step="1" placeholder="05:40"></div><div class="full"><label>Estrutura do treino</label><textarea id="rstruct" placeholder="Ex.: 10 min aquecimento + 6 x 400 m / 2 min recuperação + 10 min desaquecimento"></textarea></div></div></div><div class="full"><label>Observações</label><textarea id="pobs"></textarea><button id="saveTBtn" class="btn" onclick="saveT()">Salvar treino</button></div></div></div>`;$('pd').value=new Date().toISOString().slice(0,10);modeFields()}
function modeFields(){let s=$('pm');if(!s)return;let n=(s.options[s.selectedIndex]?.dataset.name||'').toLowerCase();$('runFields').classList.toggle('hide',!n.includes('corrida'))}
function paceSec(v){if(!v)return null;let p=v.split(':').map(Number);return p[0]*60+(p[1]||0)+(p[2]||0)/60}
async function saveT(){let mod=$('pm'),modName=(mod.options[mod.selectedIndex]?.dataset.name||'').toLowerCase(),isRun=modName.includes('corrida');let p={aluno_id:$('ps').value,modalidade_id:mod.value,data_treino:$('pd').value,titulo:$('pt').value.trim(),tipo:$('pty').value.trim(),duracao_planejada_min:+$('pmin').value||null,pse_planejada:$('ppse').value===''?null:+$('ppse').value,objetivo:$('pobj').value.trim(),observacoes:$('pobs').value.trim(),criado_por:U.id};if(!p.aluno_id||!p.modalidade_id||!p.data_treino||!p.titulo)return alert('Preencha aluno, modalidade, data e título.');let b=$('saveTBtn');b.disabled=true;b.textContent='Salvando...';try{let r=await db.from('treinos').insert(p).select('id').single();if(r.error)throw r.error;if(isRun){let min=paceSec($('rpmin').value),max=paceSec($('rpmax').value);if(min&&max&&min>max)throw new Error('O pace mínimo deve ser mais rápido (menor) que o pace máximo.');let rc={treino_id:r.data.id,distancia_km:+$('rdist').value||null,pace_min_seg:min?Math.round(min):null,pace_max_seg:max?Math.round(max):null,zona:$('rzone').value.trim()||null,estrutura:$('rstruct').value.trim()||null};let rr=await db.from('treino_corrida').insert(rc);if(rr.error){await db.from('treinos').delete().eq('id',r.data.id);throw rr.error}}alert('Treino salvo.');go('calendar')}catch(e){alert('Não foi possível salvar: '+(e.message||e));b.disabled=false;b.textContent='Salvar treino'}}
async function calendar(){let q=db.from("treinos").select("id,data_treino,titulo,tipo,status,alunos(nome),modalidades(nome)").order("data_treino",{ascending:false});if(P.role==="aluno"&&A)q=q.eq("aluno_id",A.id);let r=await q;if(r.error)throw r.error;$("content").innerHTML=`<div class="card"><table><tr><th>Data</th>${P.role==="admin"?"<th>Aluno</th>":""}<th>Modalidade</th><th>Treino</th><th>Status</th></tr>${(r.data||[]).map(x=>`<tr><td>${x.data_treino}</td>${P.role==="admin"?`<td>${E(x.alunos?.nome)}</td>`:""}<td>${E(x.modalidades?.nome)}</td><td>${E(x.titulo)}</td><td>${E(x.status)}</td></tr>`).join("")}</table></div>`}
async function today(){if(!A){$("content").innerHTML='<div class="card">Seu login ainda não foi vinculado à ficha de aluno.</div>';return}let r=await db.from("treinos").select("id,data_treino,titulo,tipo,objetivo,observacoes,duracao_planejada_min,pse_planejada,modalidades(nome),treino_corrida(distancia_km,pace_min_seg,pace_max_seg,zona,estrutura)").eq("aluno_id",A.id).order("data_treino",{ascending:false});if(r.error)throw r.error;$("content").innerHTML=`<div class="grid">${(r.data||[]).map(x=>`<div class="card"><span class="pill">${E(x.modalidades?.nome)}</span><p>${x.data_treino}</p><h2>${E(x.titulo)}</h2><p>${E(x.objetivo||"")}</p>${x.treino_corrida?`<p><b>Distância:</b> ${x.treino_corrida.distancia_km??"—"} km<br><b>Pace-alvo:</b> ${fmtPace(x.treino_corrida.pace_min_seg)}${x.treino_corrida.pace_max_seg?"–"+fmtPace(x.treino_corrida.pace_max_seg):""}/km<br><b>Zona:</b> ${E(x.treino_corrida.zona||"—")}</p><p>${E(x.treino_corrida.estrutura||"")}</p>`:""}<p>${E(x.observacoes||"")}</p><button class="btn" onclick="fb('${x.id}')">Feedback</button></div>`).join("")}</div>`}
function fmtPace(sec){if(!sec)return "—";sec=Math.round(sec);return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}async function feedbacks(){if(P.role==="aluno")return today();let r=await db.from("feedbacks").select("*,alunos(nome),treinos(titulo)").order("created_at",{ascending:false});if(r.error)throw r.error;$("content").innerHTML=`<div class="card"><table><tr><th>Aluno</th><th>Treino</th><th>PSE</th><th>Carga</th><th>Comentário</th></tr>${(r.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${E(x.treinos?.titulo)}</td><td>${x.pse??"—"}</td><td>${x.pse&&x.duracao_real_min?x.pse*x.duracao_real_min+" UA":"—"}</td><td>${E(x.comentario||"")}</td></tr>`).join("")}</table></div>`}
function fb(id){R=null;$("content").innerHTML=`<div class="card"><h2>Feedback</h2><p>De 0 a 10, quão difícil foi a sessão?</p><div class="rpe">${Array.from({length:11},(_,i)=>`<button id="r${i}" onclick="pick(${i})">${i}</button>`).join("")}</div><p class="muted">0 repouso • 3 leve/moderado • 5 forte • 7 muito forte • 10 máximo</p><div class="form"><div><label>Duração min</label><input id="fd" type="number"></div><div><label>Distância km</label><input id="fkm" type="number" step=".01"></div><div class="full"><label>Comentário</label><textarea id="fc"></textarea><button class="btn" onclick="saveF('${id}')">Enviar</button></div></div></div>`}function pick(n){R=n;document.querySelectorAll(".rpe button").forEach(b=>b.classList.remove("on"));$("r"+n).classList.add("on")}
async function saveF(t){if(R===null)return alert("Selecione a PSE");let r=await db.from("feedbacks").upsert({treino_id:t,aluno_id:A.id,realizado:true,duracao_real_min:+$("fd").value||null,pse:R,distancia_real_km:+$("fkm").value||null,comentario:$("fc").value},{onConflict:"treino_id"});if(r.error)throw r.error;alert("Feedback enviado");go("progress")}
async function progress(){let q=db.from("feedbacks").select("pse,duracao_real_min,distancia_real_km");if(P.role==="aluno"){if(!A)return;$("content").innerHTML="";q=q.eq("aluno_id",A.id)}let r=await q;if(r.error)throw r.error;let d=r.data||[],km=d.reduce((s,x)=>s+ +(x.distancia_real_km||0),0),load=d.reduce((s,x)=>s+ +(x.pse||0)* +(x.duracao_real_min||0),0),mins=d.reduce((s,x)=>s+ +(x.duracao_real_min||0),0);$("content").innerHTML=`<div class="grid"><div class="card kpi">Sessões<b>${d.length}</b></div><div class="card kpi">Volume<b>${km.toFixed(1)} km</b></div><div class="card kpi">Carga<b>${Math.round(load)} UA</b></div><div class="card kpi">Duração<b>${mins} min</b></div></div>`}
async function finance(){let[a,p]=await Promise.all([db.from("alunos").select("id,nome").eq("ativo",true),db.from("pagamentos").select("*,alunos(nome)").order("vencimento",{ascending:false})]);if(p.error)throw p.error;$("content").innerHTML=`<div class="card"><div class="form"><div><label>Aluno</label><select id="fs">${(a.data||[]).map(x=>`<option value="${x.id}">${E(x.nome)}</option>`)}</select></div><div><label>Valor</label><input id="fv" type="number"></div><div><label>Referência</label><input id="fr" type="date"></div><div><label>Vencimento</label><input id="fven" type="date"></div><div><label>Status</label><select id="fst"><option>pendente</option><option>pago</option><option>atrasado</option></select></div><div><label>Forma</label><input id="ff"></div><div class="full"><button class="btn" onclick="saveP()">Salvar cobrança</button></div></div></div><div class="card section"><table><tr><th>Aluno</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr>${(p.data||[]).map(x=>`<tr><td>${E(x.alunos?.nome)}</td><td>${M(x.valor)}</td><td>${x.vencimento}</td><td>${x.status}</td></tr>`).join("")}</table></div>`}
async function saveP(){let r=await db.from("pagamentos").insert({aluno_id:$("fs").value,valor:+$("fv").value,referencia:$("fr").value,vencimento:$("fven").value,status:$("fst").value,forma_pagamento:$("ff").value||null,data_pagamento:$("fst").value==="pago"?new Date().toISOString().slice(0,10):null});if(r.error)throw r.error;go("finance")}
(async()=>{let r=await db.auth.getSession();if(r.data.session){U=r.data.session.user;await enter()}})();
</script></body></html>
